<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Asset-Kaufvertrag — Vertragsgenerator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/contract.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/baeste_favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/baeste_favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/baeste_favicon_io/favicon-16x16.png">
    <link rel="manifest" href="/assets/baeste_favicon_io/site.webmanifest">
    <script>
        window.APP_CONFIG = { apiBase: '/api' };
    </script>
</head>

<body>

    <!-- ── Password Gate ────────────────────────────────────── -->
    <div id="pw-gate"
        style="position:fixed;inset:0;z-index:9999;background:#f8f8f6;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;">
        <div
            style="background:#fff;border-radius:12px;padding:2.5rem 2rem;width:100%;max-width:360px;box-shadow:0 4px 24px rgba(0,0,0,.08);text-align:center;">
            <div style="font-size:2rem;margin-bottom:.5rem">🔐</div>
            <h2 style="margin:0 0 .25rem;font-size:1.1rem;color:#1a1a1a">Asset-Kaufvertrag</h2>
            <p style="margin:0 0 1.5rem;font-size:.85rem;color:#888">Bitte Zugangspasswort eingeben</p>
            <input id="pw-input" type="password" placeholder="Passwort" autofocus
                style="width:100%;box-sizing:border-box;padding:.7rem 1rem;border:1.5px solid #ddd;border-radius:8px;font-size:1rem;outline:none;margin-bottom:.75rem;">
            <div id="pw-error" style="color:#c0392b;font-size:.8rem;min-height:1.2rem;margin-bottom:.5rem"></div>
            <button id="pw-btn"
                style="width:100%;padding:.75rem;background:#2c3e50;color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer;">Weiter</button>
        </div>
    </div>
    <script>
        (function () { var K = 'uebernahme_auth', g = document.getElementById('pw-gate'); if (sessionStorage.getItem(K) === '1') { g.remove(); return } function u() { if (document.getElementById('pw-input').value === 'Übergabe300') { sessionStorage.setItem(K, '1'); g.style.opacity = '0'; g.style.transition = 'opacity .3s'; setTimeout(function () { g.remove() }, 300) } else { document.getElementById('pw-error').textContent = 'Falsches Passwort'; document.getElementById('pw-input').style.borderColor = '#c0392b'; document.getElementById('pw-input').select() } } document.getElementById('pw-btn').addEventListener('click', u); document.getElementById('pw-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') u(); document.getElementById('pw-error').textContent = ''; document.getElementById('pw-input').style.borderColor = '#ddd' }) })();
    </script>

    <div class="app-wrapper">

        <!-- ── Header ──────────────────────────────────── -->
        <header class="app-header">
            <div class="header-brand">
                <a href="/uebernahme" class="header-back" title="Zurück zur Übersicht">←</a>
                <img class="header-logo" src="/assets/baesteLogoTag_PNG.png" alt="bäste">
                <div>
                    <div class="header-title">Asset-Kaufvertrag</div>
                    <div class="header-subtitle">Modularer Vertragsgenerator</div>
                </div>
            </div>
            <div class="header-actions">
                <span class="save-indicator" id="save-indicator" title="Auto-Save Status">💾 Gespeichert</span>
                <button class="btn-secondary btn-sm" id="btn-load-draft">Entwurf laden</button>
            </div>
        </header>

        <!-- ── Progress Bar ──────────────────────────────── -->
        <div class="progress-bar-wrapper">
            <div class="progress-bar-fill" id="progress-bar-fill" style="width: 0%"></div>
        </div>
        <div class="progress-label" id="progress-label"></div>

        <!-- ── Body ──────────────────────────────────────── -->
        <div class="app-body">

            <!-- Sidebar Navigation -->
            <nav class="app-sidebar" id="sidebar-nav">
                <ul class="step-nav" id="step-nav"></ul>
            </nav>

            <!-- Main Wizard -->
            <main class="app-main" id="main-content">
                <div id="wizard-content">
                    <div class="loading-screen">
                        <div class="spinner"></div>
                        <p>Vertragsvorlage wird geladen…</p>
                    </div>
                </div>
            </main>

        </div>

        <!-- ── Footer ────────────────────────────────────── -->
        <footer class="app-footer">
            <p>⚠️ Kein Ersatz für professionelle Rechtsberatung. Alle Angaben ohne Gewähr.</p>
        </footer>
    </div>

    <!-- Load-Draft Modal -->
    <div class="modal-overlay" id="modal-load-draft" style="display:none">
        <div class="modal-box">
            <h3>Gespeicherte Entwürfe</h3>
            <div id="draft-list" class="draft-list">
                <p class="text-muted">Lade Entwürfe…</p>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" id="btn-new-draft">Neuen Vertrag starten</button>
                <button class="btn-secondary" id="btn-close-modal">Schließen</button>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/contractApp.js"></script>
</body>

</html>
