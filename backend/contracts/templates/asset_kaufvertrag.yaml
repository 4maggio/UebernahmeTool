    text: |
      § 9 Vollzugsbedingungen

      (1) Die Verpflichtung der Parteien zur Vornahme der Vollzugshandlungen
          gemäß § 7 steht unter der aufschiebenden Bedingung, dass sämtliche
          nachfolgenden Vollzugsbedingungen bis zum Vollzugstag eingetreten sind
          oder auf sie verzichtet wurde:

          a) Sämtliche Garantien des Verkäufers gemäß § 8 sind zum Vollzugstag
             weiterhin zutreffend; es ist kein Material Adverse Change eingetreten.
          b) Der Verkäufer hat sämtliche ihm nach diesem Vertrag bis zum Vollzugstag
             obliegenden Verpflichtungen erfüllt.

