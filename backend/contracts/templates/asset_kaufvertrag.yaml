                  vollständig und zutreffend offengelegt.
               b) Die in den Anlagen zu diesem Vertrag enthaltenen Informationen sind
                  vollständig und zutreffend.
               c) Es gibt keine wesentlichen Umstände, die der Verkäufer pflichtwidrig
                  verschwiegen hat.

