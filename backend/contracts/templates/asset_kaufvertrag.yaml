               b) Es sind keine Umstände eingetreten, die den Versicherungsschutz
                  gefährden oder einschränken.
               c) Es sind keine Versicherungsfälle eingetreten, die nicht reguliert
                  oder in Anlage 8.12 offengelegt sind.

      # ── 8.13 Vollständigkeit ──────────────────────────────────
      - id: garantie_vollstaendigkeit
        title: "Garantie der Vollständigkeit der Offenlegung"
        required: true
        condition: null
        tags: ["garantie", "vollstaendigkeit", "disclosure"]
        text: |
          (13) Vollständigkeit der Offenlegung:
