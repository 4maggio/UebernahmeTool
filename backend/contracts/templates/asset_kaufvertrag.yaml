# ═══════════════════════════════════════════════════════════════════════════════
# ASSET-KAUFVERTRAG — Modulares Vertragstemplate
# ═══════════════════════════════════════════════════════════════════════════════
# Qualitätsstufe: Professioneller Anwaltsentwurf (M&A-Kanzleiniveau)
# Anwendungsfall: Erwerb eines Unternehmens/Geschäftsbetriebs im Wege des Asset Deals
# Parteien-Beispiel: Privatperson (Verkäufer) → GbR (Käufer)
#
# Jeder Abschnitt (section) und jede Klausel (clause) enthält:
#   - id:          Eindeutige Kennung für das Modulsystem
#   - required:    true = Pflichtklausel | false = optionale Klausel
#   - condition:   Bedingung, unter der die Klausel eingeblendet wird (null = immer)
#   - depends_on:  Abhängigkeit von anderen Klauseln
#   - tags:        Kategorisierungs-Tags für Filter/Suche
#   - risk_note:   Hinweis auf Risiken bei Weglassen
#   - text:        Vertragstext mit {{PLATZHALTERN}}
# ═══════════════════════════════════════════════════════════════════════════════

meta:
  template_id: asset_kaufvertrag_v1
  version: "1.0.0"
  title: "Asset-Kaufvertrag (Unternehmenskauf)"
  description: "Umfassender Kaufvertrag über den Erwerb sämtlicher oder wesentlicher Vermögensgegenstände eines Unternehmens/Geschäftsbetriebs"
  legal_basis:
    - "§§ 433 ff. BGB (Kaufrecht)"
    - "§ 311b BGB (Grundstücke – notarielle Beurkundung)"
    - "§ 613a BGB (Betriebsübergang)"
    - "§ 1 Abs. 1a UStG (Geschäftsveräußerung im Ganzen)"
    - "§ 75 AO (Haftung des Betriebsübernehmers)"
  notarielle_beurkundung:
    required_if: "immobilien_enthalten OR gmbh_anteile_enthalten"
    note: "Enthält der Vertrag Grundstücke oder GmbH-Anteile, ist notarielle Beurkundung nach § 311b BGB bzw. § 15 GmbHG zwingend erforderlich."
  supported_seller_types:
    [
      "Privatperson",
      "Einzelunternehmer",
      "GbR",
      "OHG",
      "KG",
      "GmbH",
      "UG",
      "GmbH & Co. KG",
      "AG",
    ]
  supported_buyer_types:
    ["Privatperson", "GbR", "OHG", "KG", "GmbH", "UG", "GmbH & Co. KG", "AG"]

# ═══════════════════════════════════════════════════════════════════════════════
# EINGABEVARIABLEN (Platzhalter)
# ═══════════════════════════════════════════════════════════════════════════════
variables:
  # ── Parteien ──────────────────────────────────────────────
  seller:
    - id: VERKAEUFER_NAME
      label: "Vollständiger Name des Verkäufers"
      type: text
      required: true
      tooltip: "Bei natürlichen Personen: Vor- und Nachname. Bei Gesellschaften: vollständige Firmierung inkl. Rechtsformzusatz (z.B. 'Mustermann GmbH')."
    - id: VERKAEUFER_GEBURTSDATUM
      label: "Geburtsdatum des Verkäufers"
      type: date
      required: true
      condition: "seller_type == 'Privatperson' OR seller_type == 'Einzelunternehmer'"
      tooltip: "Wird zur eindeutigen Identifikation der natürlichen Person im Vertragsrubrum benötigt."
    - id: VERKAEUFER_ADRESSE
      label: "Adresse des Verkäufers"
      type: text
      required: true
      tooltip: "Vollständige Anschrift inkl. Straße/Hausnummer, PLZ und Ort. Bei Unternehmen: Geschäftssitz laut Handelsregister."
    - id: VERKAEUFER_STEUER_ID
      label: "Steuerliche Identifikationsnummer"
      type: text
      required: false
      tooltip: "Für Privatpersonen: die persönliche Steuer-ID (11-stellig). Für Unternehmen: Steuernummer des Finanzamts. Wird für die steuerliche Zuordnung der Transaktion benötigt."
    - id: VERKAEUFER_RECHTSFORM
      label: "Rechtsform des Verkäufers"
      type: select
      options:
        [
          "Privatperson",
          "Einzelunternehmer",
          "GbR",
          "OHG",
          "KG",
          "GmbH",
          "UG",
          "GmbH & Co. KG",
          "AG",
        ]
      required: true
      tooltip: "Die Rechtsform bestimmt, wer unterschreibt und welche Klauseln im Vertrag erscheinen. Bei GbR/OHG/KG haften alle Gesellschafter persönlich. Bei GmbH/AG nur das Gesellschaftsvermögen."
    - id: VERKAEUFER_REGISTERGERICHT
      label: "Registergericht und HRB/HRA-Nummer"
      type: text
      condition: "seller_type IN ['GmbH','UG','AG','OHG','KG','GmbH & Co. KG']"
      tooltip: "Z.B. 'Amtsgericht München HRB 123456'. Zu finden im Handelsregister (handelsregister.de) oder auf dem Briefkopf der Gesellschaft."
    - id: VERKAEUFER_GESCHAEFTSFUEHRER
      label: "Vertretungsberechtigte Person(en)"
      type: person_list
      person_fields:
        - { id: name, label: "Name", type: text, required: true }
        - {
            id: funktion,
            label: "Funktion",
            type: text,
            required: true,
            placeholder: "z.B. Geschäftsführer",
          }
        - { id: adresse, label: "Adresse", type: text, required: false }
        - {
            id: geburtsdatum,
            label: "Geburtsdatum",
            type: date,
            required: false,
          }
      condition: "seller_type NOT IN ['Privatperson','Einzelunternehmer']"
      tooltip: "Name und Funktion der Person(en), die die Gesellschaft nach außen vertreten darf (z.B. 'Max Mustermann, Geschäftsführer'). Muss mit dem Handelsregistereintrag übereinstimmen."

  buyer:
    - id: KAEUFER_NAME
      label: "Name/Firma des Käufers"
      type: text
      required: true
      tooltip: "Bei natürlichen Personen: Vor- und Nachname. Bei Gesellschaften: vollständige Firmierung inkl. Rechtsformzusatz."
    - id: KAEUFER_RECHTSFORM
      label: "Rechtsform des Käufers"
      type: select
      options:
        [
          "Privatperson",
          "GbR",
          "OHG",
          "KG",
          "GmbH",
          "UG",
          "GmbH & Co. KG",
          "AG",
        ]
      required: true
      tooltip: "Die Rechtsform des Käufers bestimmt die Haftungsstruktur nach dem Kauf. Eine GmbH schützt das Privatvermögen der Gesellschafter. Bei GbR haften alle Gesellschafter mit ihrem Privatvermögen."
    - id: KAEUFER_ADRESSE
      label: "Adresse des Käufers"
      type: text
      required: true
      tooltip: "Vollständige Anschrift. Bei einer neu gegründeten GmbH/GbR: die im Gesellschaftsvertrag festgelegte Geschäftsadresse."
    - id: KAEUFER_GESELLSCHAFTER
      label: "Gesellschafter der Käufer-GbR (mit Anteilen)"
      type: text
      condition: "buyer_type == 'GbR'"
      tooltip: "Alle Gesellschafter mit Namen und Beteiligungsquoten, z.B. 'Thomas Müller (50%), Sandra Müller (50%)'. Bei einer GbR haften alle Gesellschafter als Gesamtschuldner."
    - id: KAEUFER_REGISTERGERICHT
      label: "Registergericht und Registernummer"
      type: text
      condition: "buyer_type IN ['GmbH','UG','AG','OHG','KG','GmbH & Co. KG']"
      tooltip: "Handelsregisternummer der Käufergesellschaft. Muss zum Zeitpunkt des Signings bereits eingetragen sein. Bei noch nicht eingetragener GmbH in Gründung (i.G.) gesondert vermerken."
    - id: KAEUFER_GESCHAEFTSFUEHRER
      label: "Vertretungsberechtigte Person(en)"
      type: person_list
      person_fields:
        - { id: name, label: "Name", type: text, required: true }
        - {
            id: funktion,
            label: "Funktion",
            type: text,
            required: true,
            placeholder: "z.B. Geschäftsführer",
          }
        - { id: adresse, label: "Adresse", type: text, required: false }
        - {
            id: geburtsdatum,
            label: "Geburtsdatum",
            type: date,
            required: false,
          }
      condition: "buyer_type NOT IN ['Privatperson']"
      tooltip: "Person(en) die die Käufergesellschaft rechtswirksam vertreten darf, gemäß Handelsregister oder Gesellschaftsvertrag."

  # ── Unternehmen / Geschäftsbetrieb ───────────────────────
  business:
    - id: UNTERNEHMENSNAME
      label: "Firmenname / Geschäftsbezeichnung"
      type: text
      required: true
      condition: "HAT_FIRMENFORTFUEHRUNG"
      tooltip: "Der Name, unter dem das Unternehmen am Markt bekannt ist. Nur relevant wenn die Firma unter bisheriger Bezeichnung weitergeführt werden soll (§ 25 HGB)."
    - id: VERTRAGSGEGENSTAND_BESCHREIBUNG
      label: "Beschreibung der zu übertragenden Vermögenswerte"
      type: textarea
      required: true
      condition: "NOT HAT_FIRMENFORTFUEHRUNG"
      tooltip: "Eine kurze Beschreibung der Vermögenswerte, die übertragen werden (z.B. 'Sämtliche Produktionsanlagen, Rezepturen und Warenvorräte des Geschäftsbereichs Pflanzendünger'). Die Details ergeben sich aus der Asset-Liste."
    - id: UNTERNEHMENSGEGENSTAND
      label: "Gegenstand des Unternehmens"
      type: textarea
      required: true
      condition: "HAT_FIRMENFORTFUEHRUNG"
      tooltip: "Eine präzise Beschreibung der Geschäftstätigkeit (z.B. 'Herstellung und Vertrieb von Pflanzendüngern'). Nur relevant bei Geschäftsfortführung."
    - id: UNTERNEHMENSSITZ
      label: "Sitz des Unternehmens / Standort der Assets"
      type: text
      required: true
      tooltip: "Ort der Hauptniederlassung bzw. Standort der zu übertragenden Vermögenswerte."
    - id: BETRIEBSSTAETTEN
      label: "Betriebsstätten / Standorte"
      type: list
      required: false
      condition: "HAT_FIRMENFORTFUEHRUNG"
      tooltip: "Falls das Unternehmen an mehreren Orten tätig ist, alle Standorte mit Adressen auflisten. Nur relevant bei Geschäftsfortführung."

  # ── Kaufpreis ─────────────────────────────────────────────
  price:
    - id: KAUFPREIS_GESAMT
      label: "Gesamtkaufpreis (EUR)"
      type: number
      required: true
      tooltip: "Der gesamte Kaufpreis für alle übertragenen Vermögenswerte. Dieser Betrag bildet die Basis für die Grunderwerbsteuer (bei Immobilien) und die Gewerbesteuer-Hinzurechnung beim Käufer."
    - id: KAUFPREIS_SACHANLAGEN
      label: "Anteil Sachanlagen"
      type: number
      tooltip: "Kaufpreisanteil für Maschinen, Einrichtungen, Fahrzeuge etc. Dieser Anteil ist beim Käufer abschreibbar (AfA). Je höher der Sachanlagenanteil, desto günstiger für den Käufer steuerlich."
    - id: KAUFPREIS_VORRAETE
      label: "Anteil Vorräte"
      type: number
      tooltip: "Kaufpreisanteil für Warenbestände, Roh-/Hilfs-/Betriebsstoffe. Wird meist zum Buchwert oder Marktpreis bewertet. Empfehlung: separat per Inventur am Stichtag ermitteln."
    - id: KAUFPREIS_FORDERUNGEN
      label: "Anteil Forderungen"
      type: number
      tooltip: "Kaufpreisanteil für übertragene Kundenforderungen. Vorsicht: Berücksichtigen Sie Ausfallrisiken und ggf. Wertberichtigungen. Forderungen sollten einzeln in einer Anlage aufgeführt werden."
    - id: KAUFPREIS_GOODWILL
      label: "Anteil Geschäftswert/Goodwill"
      type: number
      tooltip: "Der 'immaterielle' Mehrwert des Unternehmens: Kundenstamm, Marktstellung, Mitarbeiter-Know-how. Beim Käufer über 15 Jahre abschreibbar (§ 7 Abs. 1 S. 3 EStG). Beim Verkäufer Teil des Veräußerungsgewinns."
    - id: KAUFPREIS_IP
      label: "Anteil immaterielle Vermögenswerte/IP"
      type: number
      tooltip: "Kaufpreisanteil für Marken, Patente, Software, Rezepturen etc. Separater Ausweis ist wichtig für die steuerliche Behandlung und eventuelle Lizenzierungen nach dem Kauf."
    - id: KAUFPREIS_WETTBEWERBSVERBOT
      label: "Anteil Wettbewerbsverbot"
      type: number
      tooltip: "Vergütung für das Wettbewerbsverbot des Verkäufers. Dieser Betrag ist beim Verkäufer als sonstige Einkünfte (§ 22 EStG) steuerpflichtig – nicht als Veräußerungsgewinn. Kann auch §16/§34 EStG-Begünstigungen reduzieren."

  # ── Termine ───────────────────────────────────────────────
  dates:
    - id: SIGNING_DATUM
      label: "Datum der Vertragsunterzeichnung"
      type: date
      required: true
      tooltip: "Das Datum, an dem beide Parteien den Vertrag unterschreiben (Signing). Kann vom wirtschaftlichen Stichtag und dem Vollzugstag abweichen."
    - id: STICHTAG
      label: "Wirtschaftlicher Stichtag"
      type: date
      required: true
      tooltip: "Das Datum, ab dem wirtschaftlich betrachtet der Käufer als Eigentümer gilt. Gewinne und Verluste ab diesem Datum gehen auf den Käufer über. Häufig der 1. des Folgemonats nach Signing."
    - id: CLOSING_DATUM
      label: "Vollzugstag (Closing)"
      type: date
      required: true
      tooltip: "Der Tag, an dem alle Vollzugshandlungen stattfinden: Kaufpreiszahlung, Übergabe der Vermögenswerte, Schlüsselübergabe. Nach Closing ist der Käufer rechtlicher und wirtschaftlicher Eigentümer."
    - id: UEBERGANGSFRIST_ENDE
      label: "Ende der Übergangsphase"
      type: date
      tooltip: "Zeitraum, in dem der Verkäufer aktiv beim Übergang unterstützt (Einarbeitung, Kundenkontakte, Wissenstransfer). Typisch: 4–12 Wochen nach Closing."

  # ── Konditionen ───────────────────────────────────────────
  conditions:
    - id: HAT_MITARBEITER
      label: "Werden Arbeitnehmer übernommen?"
      type: boolean
      tooltip: "Wenn Mitarbeiter übergehen, gilt zwingend § 613a BGB: Alle Arbeitsverhältnisse gehen automatisch auf den Käufer über. Kündigung wegen des Betriebsübergangs ist unzulässig. Mitarbeiter haben ein 4-Wochen-Widerspruchsrecht. Aktiviert das Arbeitnehmer-Kapitel im Vertrag."
    - id: HAT_IMMOBILIEN
      label: "Sind Grundstücke/Immobilien enthalten?"
      type: boolean
      tooltip: "Bei Übertragung von Grundstücken oder grundstücksgleichen Rechten: Notarielle Beurkundung des gesamten Vertrags erforderlich (§ 311b BGB). Grunderwerbsteuer fällt an (3,5–6,5% je nach Bundesland). Gesonderte Auflassung und Grundbucheintragung nötig."
    - id: HAT_MIETVERTRAG
      label: "Wird ein Mietvertrag übernommen/neu geschlossen?"
      type: boolean
      tooltip: "Bei Übernahme bestehender Mietverträge: Zustimmung des Vermieters erforderlich. Käufer tritt in alle Rechte und Pflichten ein. Prüfen ob Sonderkündigungsrechte oder Change-of-Control-Klauseln im Mietvertrag bestehen."
    - id: HAT_VORRAETE
      label: "Sind Warenvorräte enthalten?"
      type: boolean
      tooltip: "Warenbestände, Roh-/Hilfs-/Betriebsstoffe. Empfehlung: Inventur am Stichtag, Bestand wird dann zum Buchwert oder Marktpreis in den Kaufpreis eingerechnet (oft als variable Komponente)."
    - id: HAT_FORDERUNGEN
      label: "Werden Forderungen übertragen?"
      type: boolean
      tooltip: "Offene Kundenforderungen (Debitoren). Abtretung erfordert Zession nach §§ 398 ff. BGB. Schuldner müssen informiert werden. Vorsicht bei langfälligen Forderungen – Ausfallrisiko prüfen. Aktiviert detaillierte Forderungsklausel im Vertrag."
    - id: HAT_VERBINDLICHKEITEN
      label: "Werden Verbindlichkeiten übernommen?"
      type: boolean
      tooltip: "Beim Asset Deal gehen Verbindlichkeiten grundsätzlich NICHT automatisch über. Jede Verbindlichkeit braucht eine explizite Schuldübernahme (§ 414 BGB) mit Zustimmung des Gläubigers. Ausnahme: Steuerschulden und Sozialversicherungsbeiträge (§ 75 AO, § 25 HGB)."
    - id: HAT_EARNOUT
      label: "Gibt es eine Earn-Out-Komponente?"
      type: boolean
      tooltip: "Ein variabler Kaufpreisanteil, der von der zukünftigen Entwicklung des Unternehmens abhängt (z.B. 10% des Kaufpreises wenn Umsatz in Jahr 1 > 500.000 EUR). Wichtig: Klare Berechnungsformel, Messzeitraum, Kontrollmechanismen und was der Käufer in dieser Zeit darf/nicht darf."
    - id: HAT_RATENZAHLUNG
      label: "Erfolgt Ratenzahlung?"
      type: boolean
      tooltip: "Der Kaufpreis wird in mehreren Tranchen gezahlt statt komplett bei Closing. Vorteil für Käufer: geringerer Kapitalbedarf. Nachteil für Verkäufer: Ausfallrisiko. Empfehlung: Absicherung durch Eigentumsvorbehalt, Bankbürgschaft oder Grundschuld."
    - id: HAT_TREUHANDKONTO
      label: "Wird ein Treuhandkonto verwendet?"
      type: boolean
      tooltip: "Ein von einem Notar oder Rechtsanwalt verwaltetes Konto, auf das der Käufer den Kaufpreis vorab einzahlt. Zahlung an Verkäufer erst nach Vorliegen aller Vollzugsbedingungen. Schützt beide Parteien. Kosten: ca. 0,2–0,5% der Kaufsumme."
    - id: HAT_IP
      label: "Sind gewerbliche Schutzrechte (Marken, Patente) enthalten?"
      type: boolean
      tooltip: "Eingetragene Marken, Patente, Gebrauchsmuster, Designs. Umschreibung beim DPMA/EUIPO nach Closing erforderlich. Beachten: Laufende Anmeldungen, Verlängerungsfristen, bestehende Lizenzverträge."
    - id: HAT_DOMAINS
      label: "Werden Domains/Webseiten übertragen?"
      type: boolean
      tooltip: "Domain-Transfer bei der zuständigen Registry (z.B. DENIC für .de). Technische Voraussetzungen: Auth-Code, KK-Antrag. Auch Hosting-Verträge, SSL-Zertifikate und Social-Media-Accounts bedenken."
    - id: HAT_LIZENZEN
      label: "Werden Software-Lizenzen übertragen?"
      type: boolean
      tooltip: "Software-Lizenzen sind oft nicht übertragbar ohne Zustimmung des Lizenzgebers (z.B. Microsoft, SAP). Prüfen welche Lizenzen volumenbezogen oder personenbezogen sind. Bei SaaS-Verträgen: meist neuer Vertrag mit Käufer nötig."
    - id: HAT_KUNDENVERTRAEGE
      label: "Werden Kundenverträge übertragen?"
      type: boolean
      tooltip: "Verträge mit Kunden können nur mit Zustimmung der Kunden übertragen werden (§ 398 BGB für Forderungen, Vertragsübernahme benötigt alle drei Parteien). Prüfen ob Rahmenverträge Change-of-Control-Klauseln enthalten."
    - id: HAT_LIEFERANTENVERTRAEGE
      label: "Werden Lieferantenverträge übertragen?"
      type: boolean
      tooltip: "Wie bei Kundenverträgen: Zustimmung der Lieferanten erforderlich. Besonders wichtig bei exklusiven Lieferbeziehungen, Sonderkonditionen oder laufenden Bestellungen."
    - id: HAT_FAHRZEUGE
      label: "Sind Fahrzeuge enthalten?"
      type: boolean
      tooltip: "Ummeldung beim Straßenverkehrsamt erforderlich. Kfz-Versicherung: neuer Versicherungsvertrag. Leasing-Fahrzeuge: Zustimmung der Leasinggesellschaft. Liste der Fahrzeuge mit Kennzeichen, FIN und Kilometerstand als Anlage beifügen."
    - id: HAT_GENEHMIGUNGEN
      label: "Sind behördliche Genehmigungen/Konzessionen betroffen?"
      type: boolean
      tooltip: "Gaststättenkonzession, Gewerbeerlaubnis, BImSchG-Genehmigung, Ausschankerlaubnis etc. sind personenbezogen und nicht automatisch übertragbar. Käufer muss neue Genehmigung beantragen. Übergangsregelung im Vertrag wichtig."
    - id: HAT_UMWELTRISIKEN
      label: "Garantie: Es bestehen keine Umweltrisiken/Altlasten"
      type: boolean
      tooltip: "Aktiviert eine Schutzklausel zugunsten des Käufers. Der Verkäufer garantiert, dass keine Bodenkontamination, Altlasten oder Lagerung gefährlicher Stoffe vorliegen. Bei Verletzung haftet der Verkäufer und stellt den Käufer frei. Empfohlen für alle Deals."
    - id: HAT_RECHTSSTREITIGKEITEN
      label: "Garantie: Es sind keine Rechtsstreitigkeiten anhängig"
      type: boolean
      tooltip: "Aktiviert eine Schutzklausel zugunsten des Käufers. Der Verkäufer garantiert, dass keine laufenden Klagen, Gerichts- oder Behördenverfahren bestehen. Bei Falschaussage haftet der Verkäufer und stellt den Käufer von allen Kosten frei."
    - id: SCHIEDSGERICHT
      label: "Schiedsgerichtsvereinbarung statt ordentlicher Gerichtsbarkeit?"
      type: boolean
      tooltip: "Ein privates Schiedsgericht statt staatlichem Gericht. Vorteile: Vertraulichkeit, Fachkenntnisse, oft schneller. Nachteile: Teurer (Schiedsrichterkosten), kein direkter Mahnbescheid möglich. Empfehlung bei Streitwerten > 500.000 EUR."
    - id: HAT_BERATERVERTRAG
      label: "Soll der Verkäufer als Berater tätig werden?"
      type: boolean
      tooltip: "Ein seperater Beratervertrag mit dem Verkäufer zur Einarbeitungsphase. Definiert Stundensatz, Umfang, Laufzeit. Achtung: Nicht als verkapptes Arbeitsverhältnis ausgestalten (Scheinselbstständigkeit). Empfehlung: max. 6–12 Monate."
    - id: HAT_FIRMENFORTFUEHRUNG
      label: "Soll das Geschäft unter bisheriger Bezeichnung weitergeführt werden (§ 25 HGB)?"
      type: boolean
      tooltip: "§ 25 HGB: Wer ein Handelsgeschäft unter bisheriger Firma fortführt, haftet für alle betrieblichen Verbindlichkeiten des Vorbesitzers – auch unbekannte! Deaktivieren = expliziter Ausschluss dieser Haftung. Aktivieren = Haftungsübernahme mit Begrenzungsmechanismus über § 25 Abs. 2 HGB."
    - id: HAT_LOI
      label: "Wurde ein Letter of Intent (LOI) unterzeichnet?"
      type: boolean
      tooltip: "Ein Letter of Intent (Absichtserklärung) ist eine vorvertragliche Vereinbarung über die Grundzüge des Deals. Falls ein LOI existiert, wird er im Vertrag referenziert. Der Kaufvertrag ersetzt und verdrängt alle vorherigen Vereinbarungen (Merger-Clausel)."
    - id: HAT_EXKLUSIVITAET
      label: "Besteht eine Exklusivitätsvereinbarung?"
      type: boolean
      tooltip: "Eine Exklusivitätsvereinbarung untersagt dem Verkäufer, parallel mit anderen Interessenten zu verhandeln. Üblicherweise zeitlich begrenzt (30–90 Tage). Aktiviert entsprechende Klausel im Vertragsrubrum."
    - id: UEBERGANG_IM_KAUFPREIS
      label: "Einarbeitung ist im Kaufpreis enthalten (keine separate Vergütung)"
      type: boolean
      tooltip: "Wenn aktiviert, ist die Übergangsbegleitung/Einarbeitung des Verkäufers mit dem Kaufpreis abgegolten – keine gesonderte Vergütung. Deaktiviert = Verkäufer erhält zusätzlich einen Stundensatz für die Einarbeitung."
    - id: BASKET_TIPPING
      label: "Tipping Basket (volle Haftung ab dem 1. Euro bei Überschreitung des Freibetrags)"
      type: boolean
      tooltip: "Bestimmt, was passiert wenn die Gesamtsumme aller Garantieansprüche den vereinbarten Freibetrag (Basket) übersteigt. Tipping Basket = Verkäufer haftet dann rückwirkend ab dem 1. Euro. Deductible = Verkäufer haftet nur für den übersteigenden Betrag. Tipping ist käuferfreundlicher."

# ═══════════════════════════════════════════════════════════════════════════════
# VERTRAGSABSCHNITTE
# ═══════════════════════════════════════════════════════════════════════════════

sections:
  # ═════════════════════════════════════════════════════════════════════════════
  # § 0 — RUBRUM (Vertragsparteien)
  # ═════════════════════════════════════════════════════════════════════════════
  - id: rubrum
    title: "Rubrum"
    required: true
    condition: null
    order: 0
    text: |
      ASSET-KAUFVERTRAG
      (Unternehmenskaufvertrag im Wege des Asset Deals)

      zwischen

      {{VERKAEUFER_NAME}},
      geboren am {{VERKAEUFER_GEBURTSDATUM}},
      wohnhaft {{VERKAEUFER_ADRESSE}},

      — nachfolgend „Verkäufer" genannt —

      und

      {{KAEUFER_NAME}},
      {{KAEUFER_RECHTSFORM}}, bestehend aus den Gesellschaftern:
      {{KAEUFER_GESELLSCHAFTER}},
      mit Sitz in {{KAEUFER_ADRESSE}},

      — nachfolgend „Käufer" genannt —

      Verkäufer und Käufer nachfolgend einzeln auch „Partei" und gemeinsam „Parteien" genannt.

    variants:
      - id: rubrum_gbr_seller
        condition: "seller_type == 'GbR'"
        replaces: "VERKAEUFER_NAME block"
        text: |
          {{VERKAEUFER_NAME}},
          Gesellschaft bürgerlichen Rechts, bestehend aus den Gesellschaftern:
          {{VERKAEUFER_GESELLSCHAFTER}},
          mit Sitz in {{VERKAEUFER_ADRESSE}},
          vertreten durch {{VERKAEUFER_GESCHAEFTSFUEHRER}},

      - id: rubrum_gmbh_seller
        condition: "seller_type == 'GmbH' OR seller_type == 'UG'"
        replaces: "VERKAEUFER_NAME block"
        text: |
          {{VERKAEUFER_NAME}},
          eingetragen im Handelsregister des {{VERKAEUFER_REGISTERGERICHT}},
          mit Sitz in {{VERKAEUFER_ADRESSE}},
          vertreten durch den Geschäftsführer {{VERKAEUFER_GESCHAEFTSFUEHRER}},

      - id: rubrum_privatperson_buyer
        condition: "buyer_type == 'Privatperson'"
        replaces: "KAEUFER_NAME block"
        text: |
          {{KAEUFER_NAME}},
          geboren am {{KAEUFER_GEBURTSDATUM}},
          wohnhaft {{KAEUFER_ADRESSE}},

      - id: rubrum_gmbh_buyer
        condition: "buyer_type == 'GmbH' OR buyer_type == 'UG'"
        replaces: "KAEUFER_NAME block"
        text: |
          {{KAEUFER_NAME}},
          eingetragen im Handelsregister des {{KAEUFER_REGISTERGERICHT}},
          mit Sitz in {{KAEUFER_ADRESSE}},
          vertreten durch den Geschäftsführer {{KAEUFER_GESCHAEFTSFUEHRER}},

  # ═════════════════════════════════════════════════════════════════════════════
  # § 1 — PRÄAMBEL
  # ═════════════════════════════════════════════════════════════════════════════
  - id: praeambel
    title: "Präambel"
    required: true
    condition: null
    order: 1
    text: |
      § 1 Präambel

    clauses:
      - id: praeambel_body_fortfuehrung
        title: "Präambel — Geschäftsfortführung"
        required: false
        condition: "HAT_FIRMENFORTFUEHRUNG"
        tags: ["praeambel", "fortfuehrung"]
        text: |
          (1) Der Verkäufer betreibt unter der Bezeichnung „{{UNTERNEHMENSNAME}}" ein Unternehmen
              mit dem Gegenstand: {{UNTERNEHMENSGEGENSTAND}}
              am Standort {{UNTERNEHMENSSITZ}} (nachfolgend der „Geschäftsbetrieb").

          (2) Der Verkäufer beabsichtigt, den Geschäftsbetrieb mit sämtlichen in diesem Vertrag
              näher bezeichneten Vermögensgegenständen im Wege eines Asset Deals auf den Käufer
              zu übertragen. Der Käufer beabsichtigt, den Geschäftsbetrieb zu erwerben und
              unter der bisherigen Geschäftsbezeichnung fortzuführen.

          (3) Die Parteien haben im Vorfeld dieses Vertrages eine Due-Diligence-Prüfung
              durchgeführt. Die Ergebnisse sind den Parteien bekannt und in den Anlagen
              zu diesem Vertrag dokumentiert. Der Käufer hat die wirtschaftlichen, rechtlichen
              und steuerlichen Verhältnisse des Geschäftsbetriebs eingehend geprüft.

          (4) Vor diesem Hintergrund schließen die Parteien den nachfolgenden Kaufvertrag:

      - id: praeambel_body_asset_only
        title: "Präambel — Reiner Asset Deal"
        required: false
        condition: "NOT HAT_FIRMENFORTFUEHRUNG"
        tags: ["praeambel", "asset_deal"]
        text: |
          (1) Der Verkäufer ist Eigentümer der in diesem Vertrag näher bezeichneten
              Vermögensgegenstände, die sich am Standort {{UNTERNEHMENSSITZ}} befinden.

          (2) Der Verkäufer beabsichtigt, die nachfolgend aufgeführten Vermögensgegenstände
              im Wege eines Asset Deals einzeln auf den Käufer zu übertragen. Eine Übernahme
              des Geschäftsbetriebs als Ganzes oder eine Fortführung unter bisheriger
              Geschäftsbezeichnung im Sinne des § 25 HGB ist ausdrücklich nicht beabsichtigt.

          (3) Die Parteien haben im Vorfeld dieses Vertrages die zu übertragenden
              Vermögensgegenstände geprüft. Der Käufer hat den Zustand und Wert
              der Kaufgegenstände eingehend untersucht.

          (4) Vor diesem Hintergrund schließen die Parteien den nachfolgenden Kaufvertrag:
      - id: praeambel_loi_bezug
        title: "Bezugnahme auf Letter of Intent"
        required: false
        condition: "HAT_LOI"
        tags: ["loi", "vorvertrag"]
        text: |
          (5) Die Parteien haben am {{LOI_DATUM}} eine Absichtserklärung (Letter of Intent)
              unterzeichnet. Dieser Vertrag ersetzt die Absichtserklärung vollständig.
              Ansprüche aus der Absichtserklärung bestehen mit Abschluss dieses Vertrages
              nicht mehr fort, soweit in diesem Vertrag nicht ausdrücklich etwas anderes
              bestimmt ist.

      - id: praeambel_exklusivitaet
        title: "Exklusivitätsklausel"
        required: false
        condition: "HAT_EXKLUSIVITAET"
        tags: ["exklusivitaet"]
        text: |
          (6) Der Verkäufer versichert, dass er seit dem {{EXKLUSIVITAET_DATUM}} keine
              Verhandlungen mit Dritten über den Verkauf des Geschäftsbetriebs oder
              wesentlicher Teile davon geführt hat und bis zum Vollzugstag keine solchen
              Verhandlungen aufnehmen wird.

  # ═════════════════════════════════════════════════════════════════════════════
  # § 2 — VERTRAGSGEGENSTAND
  # ═════════════════════════════════════════════════════════════════════════════
  - id: vertragsgegenstand
    title: "Vertragsgegenstand"
    required: true
    condition: null
    order: 2
    text: |
      § 2 Vertragsgegenstand

    clauses:
      - id: vertragsgegenstand_intro_fortfuehrung
        title: "Einleitung Vertragsgegenstand — Geschäftsfortführung"
        required: false
        condition: "HAT_FIRMENFORTFUEHRUNG"
        text: |
          (1) Der Verkäufer verkauft und überträgt hiermit an den Käufer, und der Käufer kauft
              und übernimmt vom Verkäufer den Geschäftsbetrieb „{{UNTERNEHMENSNAME}}" mit
              sämtlichen nachfolgend bezeichneten Vermögensgegenständen (nachfolgend gemeinsam
              die „Kaufgegenstände"):

      - id: vertragsgegenstand_intro_asset_only
        title: "Einleitung Vertragsgegenstand — Reiner Asset Deal"
        required: false
        condition: "NOT HAT_FIRMENFORTFUEHRUNG"
        text: |
          (1) Der Verkäufer verkauft und überträgt hiermit an den Käufer, und der Käufer kauft
              und übernimmt vom Verkäufer die nachfolgend einzeln bezeichneten
              Vermögensgegenstände (nachfolgend gemeinsam die „Kaufgegenstände"):

      # ── 2.1 Sachanlagen ───────────────────────────────────────
      - id: kaufgegenstand_sachanlagen
        title: "Sachanlagen (Maschinen, Einrichtung, Werkzeuge)"
        required: true
        condition: null
        tags: ["sachanlagen", "betriebsausstattung"]
        text: |
          (2) Sachanlagen und Betriebsausstattung:
              Sämtliche zum Geschäftsbetrieb gehörenden beweglichen Sachen, insbesondere:
              a) Maschinen und maschinelle Anlagen,
              b) Betriebs- und Geschäftsausstattung,
              c) Büromöbel und Büroeinrichtung,
              d) EDV-Hardware (Computer, Server, Peripheriegeräte),
              e) Werkzeuge und Kleingeräte,
              f) sonstige Betriebsmittel,
              jeweils im Zustand zum Stichtag gemäß § 5 und im Einzelnen aufgeführt
              in Anlage 2.2 (Inventarliste).

      # ── 2.2 Fahrzeuge ─────────────────────────────────────────
      - id: kaufgegenstand_fahrzeuge
        title: "Fahrzeuge"
        required: false
        condition: "HAT_FAHRZEUGE"
        tags: ["fahrzeuge", "kfz"]
        risk_note: "Bei Weglassen verbleiben Fahrzeuge beim Verkäufer. Ggf. müssen separate Kaufverträge geschlossen werden."
        text: |
          (3) Fahrzeuge:
              Die in Anlage 2.3 aufgelisteten Kraftfahrzeuge einschließlich sämtlichen
              Zubehörs und Fahrzeugdokumente (Fahrzeugbriefe, Serviceheft, etc.).
              Die Umschreibung der Fahrzeuge auf den Käufer erfolgt unverzüglich nach
              dem Vollzugstag auf Kosten des Käufers. Der Verkäufer wird die hierfür
              erforderlichen Unterlagen und Vollmachten dem Käufer spätestens am
              Vollzugstag übergeben.

      # ── 2.3 Immobilien ────────────────────────────────────────
      - id: kaufgegenstand_immobilien
        title: "Grundstücke und Immobilien"
        required: false
        condition: "HAT_IMMOBILIEN"
        tags: ["immobilien", "grundstueck", "notarpflicht"]
        risk_note: "ACHTUNG: Bei Grundstücksübertragung ist notarielle Beurkundung des GESAMTEN Vertrags gemäß § 311b BGB erforderlich. Grunderwerbsteuer fällt an."
        text: |
          (4) Grundstücke und grundstücksgleiche Rechte:
              Das im Grundbuch von {{GRUNDBUCHAMT}}, Blatt {{GRUNDBUCHBLATT}},
              Flur {{FLUR}}, Flurstück {{FLURSTUECK}}, eingetragene Grundstück
              ({{GRUNDSTUECKSADRESSE}}) mit einer Größe von ca. {{GRUNDSTUECKSGROESSE}} m²
              einschließlich aller aufstehenden Gebäude und wesentlichen Bestandteile
              (nachfolgend das „Grundstück").

              Der Verkäufer bewilligt und der Käufer beantragt die Eintragung der
              Eigentumsänderung im Grundbuch. Die Auflassung wird hiermit erklärt.

              Die Parteien werden die Löschung etwaiger zugunsten des Verkäufers oder
              Dritter eingetragener Belastungen unverzüglich nach dem Vollzugstag
              herbeiführen, soweit in diesem Vertrag nicht anders bestimmt.

      # ── 2.4 Mietvertrag ───────────────────────────────────────
      - id: kaufgegenstand_mietvertrag
        title: "Eintritt in Mietvertrag / Untermietvertrag"
        required: false
        condition: "HAT_MIETVERTRAG AND NOT HAT_IMMOBILIEN"
        tags: ["miete", "gewerberaeume"]
        text: |
          (5) Miet-/Pachtvertrag:
              Der Käufer tritt mit Wirkung zum Vollzugstag in den zwischen dem Verkäufer
              und {{VERMIETER_NAME}} bestehenden Mietvertrag vom {{MIETVERTRAG_DATUM}}
              über die Geschäftsräume {{GESCHAEFTSRAEUME_ADRESSE}} ein. Der Verkäufer
              wird die Zustimmung des Vermieters zum Eintritt des Käufers in den
              Mietvertrag bis spätestens zum Vollzugstag einholen. Wird die Zustimmung
              verweigert, gelten die Regelungen in § 9 (Vollzugsbedingungen).

              Die beim Vermieter hinterlegte Mietkaution in Höhe von {{MIETKAUTION_BETRAG}} EUR
              wird wie folgt behandelt: {{MIETKAUTION_REGELUNG}}.

      # ── 2.5 Vorräte ───────────────────────────────────────────
      - id: kaufgegenstand_vorraete
        title: "Warenvorräte und Lagerbestände"
        required: false
        condition: "HAT_VORRAETE"
        tags: ["vorraete", "waren", "lager"]
        text: |
          (6) Vorräte:
              Sämtliche zum Geschäftsbetrieb gehörenden Roh-, Hilfs- und Betriebsstoffe,
              unfertigen und fertigen Erzeugnisse sowie Waren (nachfolgend „Vorräte")
              im Zustand und Umfang zum Stichtag gemäß § 5, nach Maßgabe der am Stichtag
              durchzuführenden gemeinsamen Inventur (Anlage 2.6).

              Die Bewertung der Vorräte erfolgt wie folgt:
              a) Fertigerzeugnisse: zum niedrigeren Wert aus Herstellungskosten und
                 Nettoveräußerungswert,
              b) Rohmaterial und Handelswaren: zum niedrigeren Wert aus Anschaffungskosten
                 und Wiederbeschaffungskosten,
              c) Unverkäufliche, beschädigte oder überalterte Vorräte (älter als
                 {{VORRAETE_UEBERALTERUNG_MONATE}} Monate) werden nicht übernommen
                 oder mit einem Abschlag von {{VORRAETE_ABSCHLAG_PROZENT}} % bewertet.

              Der endgültige Vorrätewert wird in einem gemeinsamen Protokoll festgestellt
              und führt zu einer Anpassung des Kaufpreises gemäß § 3 Abs. (6).

      # ── 2.6 Forderungen ───────────────────────────────────────
      - id: kaufgegenstand_forderungen
        title: "Forderungen und Anzahlungen"
        required: false
        condition: "HAT_FORDERUNGEN"
        tags: ["forderungen", "debitoren"]
        risk_note: "Forderungsübernahme erfordert Abtretung (§ 398 BGB). Bei Verbraucherforderungen: Datenschutz beachten."
        text: |
          (7) Forderungen:
              Die in Anlage 2.7 aufgeführten Forderungen aus Lieferungen und Leistungen
              (nachfolgend „Forderungen") werden hiermit an den Käufer abgetreten.
              Der Verkäufer tritt hiermit sämtliche in Anlage 2.7 bezeichneten Forderungen
              an den Käufer ab. Der Käufer nimmt die Abtretung an.

              Forderungen werden wie folgt bewertet:
              a) Forderungen mit einer Fälligkeit von weniger als 30 Tagen: 100 % des Nennwerts,
              b) Forderungen mit einer Fälligkeit von 30–90 Tagen: {{FORDERUNGEN_30_90_PROZENT}} %
                 des Nennwerts,
              c) Forderungen mit einer Fälligkeit von mehr als 90 Tagen: {{FORDERUNGEN_UEBER_90_PROZENT}} %
                 des Nennwerts,
              d) Zweifelhafte Forderungen gemäß Anlage 2.7a werden nicht übernommen.

              Der Verkäufer wird die Schuldner der abgetretenen Forderungen unverzüglich
              nach dem Vollzugstag über die Abtretung unterrichten und zur Zahlung an den
              Käufer auffordern.

              Soweit innerhalb von {{FORDERUNGEN_GARANTIEFRIST_MONATE}} Monaten nach dem
              Stichtag eine Forderung vom Schuldner nicht beglichen wird, erstattet der
              Verkäufer dem Käufer den für die betreffende Forderung gezahlten Kaufpreisanteil
              zurück, es sei denn, der Forderungsausfall beruht auf einem Umstand, den der
              Käufer zu vertreten hat.

      # ── 2.7 Kundenverträge ────────────────────────────────────
      - id: kaufgegenstand_kundenvertraege
        title: "Kundenverträge und Rahmenvereinbarungen"
        required: false
        condition: "HAT_KUNDENVERTRAEGE"
        tags: ["kunden", "vertraege", "dauerschuldverhaeltnisse"]
        text: |
          (8) Kundenverträge:
              Die in Anlage 2.8 aufgeführten Verträge mit Kunden (nachfolgend
              „Kundenverträge") werden im Wege der Vertragsübernahme auf den Käufer
              übertragen. Der Verkäufer wird die Zustimmung der jeweiligen
              Vertragspartner zur Vertragsübernahme unverzüglich, spätestens aber
              bis zum Vollzugstag einholen.

              Wird die Zustimmung eines Vertragspartners nicht rechtzeitig erteilt,
              wird der Verkäufer den betreffenden Vertrag treuhänderisch für Rechnung
              des Käufers fortführen, bis die Zustimmung erteilt oder der Vertrag
              anderweitig beendet wird. Die wirtschaftlichen Vor- und Nachteile aus
              einem solchen Vertrag stehen ab dem Stichtag dem Käufer zu.

      # ── 2.8 Lieferantenverträge ───────────────────────────────
      - id: kaufgegenstand_lieferantenvertraege
        title: "Lieferantenverträge"
        required: false
        condition: "HAT_LIEFERANTENVERTRAEGE"
        tags: ["lieferanten", "vertraege"]
        text: |
          (9) Lieferantenverträge:
              Die in Anlage 2.9 aufgeführten Verträge mit Lieferanten und
              Dienstleistern werden im Wege der Vertragsübernahme auf den Käufer
              übertragen. § 2 Abs. (8) Sätze 2–4 gelten entsprechend.

      # ── 2.9 Firma / Geschäftsbezeichnung ──────────────────────
      - id: kaufgegenstand_firma
        title: "Firmenname und Geschäftsbezeichnung"
        required: false
        condition: null
        tags: ["firma", "name", "marke"]
        text: |
          (10) Firma und Geschäftsbezeichnung:
               Das Recht zur Führung der Geschäftsbezeichnung „{{UNTERNEHMENSNAME}}"
               einschließlich aller damit verbundenen Namens- und Kennzeichenrechte.
               Der Verkäufer wird ab dem Vollzugstag die Geschäftsbezeichnung nicht
               mehr verwenden und auf Verlangen des Käufers die für eine Umschreibung
               erforderlichen Erklärungen abgeben.

      # ── 2.9a § 25 HGB – Firmenfortführung gewünscht ───────────
      - id: kaufgegenstand_par25_fortfuehrung
        title: "§ 25 HGB – Geschäftsfortführung mit Haftungsübernahme"
        required: false
        condition: "HAT_FIRMENFORTFUEHRUNG"
        tags: ["firma", "hgb", "haftung", "fortfuehrung"]
        text: |
          (10a) Firmenfortführung (§ 25 HGB):
               Der Käufer wird das Handelsgeschäft unter der bisherigen
               Geschäftsbezeichnung „{{UNTERNEHMENSNAME}}" fortführen.
               Die Parteien sind sich bewusst, dass der Käufer gemäß § 25 Abs. 1 HGB
               für alle im Betrieb des Geschäfts begründeten Verbindlichkeiten des
               Verkäufers haftet, sofern diese nicht ausdrücklich ausgenommen werden.

               Abweichend von § 25 Abs. 1 HGB vereinbaren die Parteien, dass der
               Käufer ausschließlich die in Abschnitt „Verbindlichkeiten" dieses
               Vertrages ausdrücklich aufgeführten Verbindlichkeiten übernimmt.
               Sämtliche übrigen Verbindlichkeiten verbleiben beim Verkäufer;
               dieser stellt den Käufer von allen daraus resultierenden Ansprüchen
               Dritter frei. Diese Haftungsbeschränkung wird gemäß § 25 Abs. 2 HGB
               gegenüber Dritten durch Eintragung im Handelsregister oder durch
               unverzügliche Bekanntmachung gegenüber Gläubigern wirksam gemacht.

      # ── 2.9b § 25 HGB – ausdrücklich ausgeschlossen ──────────
      - id: kaufgegenstand_par25_ausschluss
        title: "§ 25 HGB – Ausdrücklicher Ausschluss der Haftungsübernahme"
        required: false
        condition: "NOT HAT_FIRMENFORTFUEHRUNG"
        tags: ["firma", "hgb", "haftung", "ausschluss"]
        text: |
          (10a) Kein § 25 HGB:
               Der Käufer ist nicht verpflichtet, das Geschäft unter der bisherigen
               Geschäftsbezeichnung fortzuführen. Eine Firmenfortführung im Sinne
               des § 25 HGB ist nicht beabsichtigt und wird ausdrücklich
               ausgeschlossen. Der Käufer übernimmt keine Haftung für Verbindlichkeiten
               des Verkäufers aus dem bisherigen Geschäftsbetrieb, soweit diese nicht
               ausdrücklich in diesem Vertrag übernommen werden.

      # ── 2.10 Gewerbliche Schutzrechte / IP ────────────────────
      - id: kaufgegenstand_ip
        title: "Gewerbliche Schutzrechte und geistiges Eigentum"
        required: false
        condition: "HAT_IP"
        tags: ["ip", "patent", "marke", "geschmacksmuster", "urheberrecht"]
        text: |
          (11) Gewerbliche Schutzrechte und geistiges Eigentum:
               a) Die in Anlage 2.11a aufgeführten eingetragenen Marken, Patente,
                  Gebrauchsmuster und Designs einschließlich aller Anmeldungen und
                  Prioritätsrechte,
               b) sämtliche Urheberrechte und Nutzungsrechte an Werken, die im Rahmen
                  des Geschäftsbetriebs erstellt wurden (Software, Texte, Grafiken,
                  Fotos, Videos, Datenbanken),
               c) Geschäftsgeheimnisse und Know-how des Geschäftsbetriebs, insbesondere
                  Rezepturen, Produktionsverfahren, technische Zeichnungen und
                  Konstruktionspläne,
               d) sonstige immaterielle Vermögenswerte gemäß Anlage 2.11b.

               Der Verkäufer wird die für die Umschreibung der Schutzrechte beim
               zuständigen Amt (DPMA, EUIPO) erforderlichen Erklärungen
               unverzüglich nach dem Vollzugstag abgeben und die Kosten der
               Umschreibung trägt der Käufer.

      # ── 2.11 Domains und Online-Präsenzen ─────────────────────
      - id: kaufgegenstand_domains
        title: "Domains, Webseiten und Social-Media-Accounts"
        required: false
        condition: "HAT_DOMAINS"
        tags: ["domains", "website", "social_media", "digital"]
        text: |
          (12) Domains, Webseiten und Online-Präsenzen:
               a) Die in Anlage 2.12 aufgeführten Internet-Domains einschließlich aller
                  zugehörigen Inhalte, Datenbanken und Konfigurationen,
               b) Hosting-Verträge und SSL-Zertifikate,
               c) Social-Media-Accounts ({{SOCIAL_MEDIA_PLATTFORMEN}}),
               d) Google Business Profile, Google Ads-Konten und sonstige Online-Marketing-Konten,
               e) Newsletter-Abonnenten und E-Mail-Marketing-Listen
                  (vorbehaltlich datenschutzrechtlicher Zulässigkeit gemäß Art. 6 DSGVO),
               f) sonstige digitale Assets gemäß Anlage 2.12.

               Der Verkäufer wird die Übertragung der Domains durch entsprechende
               Auth-Codes und Freigaben bei den zuständigen Registraren unverzüglich
               nach dem Vollzugstag veranlassen.

      # ── 2.11a Online-Shop / Webshop ───────────────────────────
      - id: kaufgegenstand_onlineshop
        title: "Online-Shop / Webshop (Quellcode, Design, Inhalte, Zugänge)"
        required: false
        condition: "HAT_DOMAINS"
        tags: ["onlineshop", "webshop", "quellcode", "design", "e_commerce"]
        hint: "Erfasst alle Bestandteile eines Online-Shops als eigenständige Kaufgegenstände — Quellcode, Design, Inhalte, Shop-System und Zugänge."
        text: |
          (12a) Online-Shop / Webshop:
                Soweit der Geschäftsbetrieb einen Online-Shop umfasst, werden
                zusätzlich zu den in Abs. (12) genannten Gegenständen insbesondere
                übertragen:

                a) Quellcode (Source Code):
                   Der vollständige Quellcode des Online-Shops einschließlich
                   aller Eigenentwicklungen, Plug-ins, Erweiterungen, Themes
                   und Konfigurationsdateien. Der Verkäufer versichert, dass
                   der Quellcode frei von Rechten Dritter ist oder die
                   erforderlichen Lizenzen in Anlage 2.13 aufgeführt sind.

                b) Design und Layout:
                   Sämtliche grafischen Gestaltungselemente des Online-Shops
                   (Templates, Themes, Logos, Icons, Farbschemata, Schriftarten),
                   einschließlich der Quelldateien (PSD, Sketch, Figma o. Ä.),
                   soweit vorhanden.

                c) Inhalte (Content):
                   Sämtliche im Online-Shop veröffentlichten Inhalte,
                   insbesondere Produktbeschreibungen, Produktfotos und -videos,
                   Kategorietexte, Blog-Beiträge, FAQ-Texte, AGB, Impressum
                   und Datenschutzerklärung (letztere zur Anpassung durch den
                   Käufer). Der Verkäufer versichert, dass er berechtigt ist,
                   sämtliche Inhalte zu nutzen und zu übertragen, und dass
                   keine Urheberrechte Dritter verletzt werden.

                d) Shop-System und Zugänge:
                   Sämtliche Zugangsdaten zum Shop-System
                   ({{SHOP_SYSTEM_NAME}}), einschließlich:
                   - Administrator-Zugänge zum Backend/CMS,
                   - Datenbank-Zugänge,
                   - FTP/SFTP/SSH-Zugänge zum Webserver,
                   - Payment-Provider-Konten ({{PAYMENT_PROVIDER}}),
                   - Versanddienstleister-Konten und API-Schlüssel,
                   - E-Mail-Konten und -Weiterleitungen,
                   - Analytics-Zugänge (Google Analytics, Search Console etc.).

                e) Kundenbewertungen und Rezensionen:
                   Soweit rechtlich zulässig und technisch möglich, werden
                   vorhandene Kundenbewertungen und Rezensionen auf den
                   Käufer übertragen.

                Der Verkäufer wird sämtliche Zugangsdaten in einem gesicherten
                Übergabeprotokoll (Anlage 12a) dokumentieren und dem Käufer
                am Vollzugstag übergeben. Der Verkäufer wird nach dem Vollzugstag
                sämtliche eigenen Zugänge löschen oder dem Käufer die Löschung
                ermöglichen.

      # ── 2.12 Software-Lizenzen ────────────────────────────────
      - id: kaufgegenstand_lizenzen
        title: "Software-Lizenzen"
        required: false
        condition: "HAT_LIZENZEN"
        tags: ["software", "lizenzen", "it"]
        text: |
          (13) Software-Lizenzen:
               Die in Anlage 2.13 aufgeführten Software-Lizenzen, soweit diese
               vertraglich übertragbar sind. Der Verkäufer wird die für die Übertragung
               erforderlichen Zustimmungen der Lizenzgeber einholen. Soweit einzelne
               Lizenzen nicht übertragbar sind, wird der Verkäufer dem Käufer dies
               unverzüglich mitteilen; in diesem Fall wird der Kaufpreis gemäß § 3
               Abs. (7) angepasst.

      # ── 2.13 Kundenstamm / Geschäftsdaten ─────────────────────
      - id: kaufgegenstand_kundenstamm
        title: "Kundenstamm und Geschäftsdaten"
        required: false
        condition: null
        tags: ["kunden", "daten", "datenschutz"]
        text: |
          (14) Kundenstamm und Geschäftsdaten:
               a) Kundenlisten, Kundendateien und Kundenstammdaten,
               b) Lieferanten- und Kontaktdatenbanken,
               c) Buchhaltungsunterlagen und Geschäftskorrespondenz
                  (soweit gesetzlich zulässig),
               d) technische Dokumentation und Betriebsanleitungen.

               Die Übertragung personenbezogener Daten erfolgt ausschließlich im
               Einklang mit der Datenschutz-Grundverordnung (DSGVO) und dem BDSG.
               Soweit erforderlich, werden die Parteien eine gesonderte Vereinbarung
               zur Auftragsverarbeitung gemäß Art. 28 DSGVO abschließen. Der Verkäufer
               wird die betroffenen Personen gemäß Art. 13, 14 DSGVO über die
               Übertragung informieren, soweit der Käufer dies nicht selbst übernimmt.

      # ── 2.14 Genehmigungen ────────────────────────────────────
      - id: kaufgegenstand_genehmigungen
        title: "Behördliche Genehmigungen und Konzessionen"
        required: false
        condition: "HAT_GENEHMIGUNGEN"
        tags: ["genehmigungen", "konzessionen", "erlaubnisse"]
        text: |
          (15) Genehmigungen und Konzessionen:
               Die in Anlage 2.15 aufgeführten behördlichen Genehmigungen, Erlaubnisse
               und Konzessionen, soweit diese übertragbar sind oder auf den Käufer
               umgeschrieben werden können. Der Verkäufer wird den Käufer bei der
               Beantragung neuer Genehmigungen, soweit die bestehenden nicht übertragbar
               sind, nach Kräften unterstützen. Die Kosten der Umschreibung oder
               Neubeantragung trägt der Käufer.

      # ── 2.15 Goodwill ─────────────────────────────────────────
      - id: kaufgegenstand_goodwill
        title: "Geschäftswert (Goodwill)"
        required: true
        condition: null
        tags: ["goodwill", "geschaeftswert"]
        text: |
          (16) Geschäftswert (Goodwill):
               Der mit dem Geschäftsbetrieb verbundene Geschäftswert (Goodwill),
               bestehend aus dem Ruf des Unternehmens, den Kunden- und
               Geschäftsbeziehungen, der Marktstellung, der Organisation und dem
               sonstigen immateriellen Wert des Geschäftsbetriebs als
               wirtschaftliche Einheit.

  # ═════════════════════════════════════════════════════════════════════════════
  # § 3 — AUSGENOMMENE VERMÖGENSGEGENSTÄNDE
  # ═════════════════════════════════════════════════════════════════════════════
  - id: ausnahmen
    title: "Ausgenommene Vermögensgegenstände"
    required: true
    condition: null
    order: 3
    text: |
      § 3 Ausgenommene Vermögensgegenstände

      (1) Von der Übertragung ausgenommen sind, soweit in diesem Vertrag nicht
          ausdrücklich etwas anderes bestimmt ist:

          a) Bankkonten und Kassenbestände des Verkäufers,
          b) Rückerstattungsansprüche des Verkäufers gegenüber Finanzbehörden
             (insbesondere Vorsteuerüberhänge und Steuererstattungsansprüche,
             die den Zeitraum vor dem Stichtag betreffen),
          c) Ansprüche des Verkäufers aus Versicherungsverträgen (soweit diese
             nicht ausdrücklich übertragen werden),
          d) persönliche Gegenstände des Verkäufers,
          e) {{WEITERE_AUSNAHMEN}}
          f) sonstige Vermögensgegenstände, die nicht ausdrücklich als Kaufgegenstände
             in § 2 bezeichnet sind.

      (2) Zweifel über die Zuordnung einzelner Gegenstände sind einvernehmlich
          zwischen den Parteien zu klären. Können sich die Parteien nicht einigen,
          entscheidet ein von beiden Parteien gemeinsam benannter Sachverständiger
          verbindlich.

  # ═════════════════════════════════════════════════════════════════════════════
  # § 4 — KAUFPREIS
  # ═════════════════════════════════════════════════════════════════════════════
  - id: kaufpreis
    title: "Kaufpreis und Kaufpreisaufteilung"
    required: true
    condition: null
    order: 4
    text: |
      § 4 Kaufpreis

      (1) Der Kaufpreis für die Kaufgegenstände beträgt

          {{KAUFPREIS_GESAMT}} EUR
          (in Worten: {{KAUFPREIS_GESAMT_WORT}} Euro)

          (nachfolgend der „Kaufpreis").

      (2) Der Kaufpreis verteilt sich auf die einzelnen Kaufgegenstände wie folgt
          (nachfolgend die „Kaufpreisaufteilung"):

          a) Sachanlagen und Betriebsausstattung:    {{KAUFPREIS_SACHANLAGEN}} EUR
          b) Vorräte (vorläufig):                    {{KAUFPREIS_VORRAETE}} EUR
          c) Forderungen (vorläufig):                {{KAUFPREIS_FORDERUNGEN}} EUR
          d) Gewerbliche Schutzrechte / IP:          {{KAUFPREIS_IP}} EUR
          e) Geschäftswert (Goodwill):               {{KAUFPREIS_GOODWILL}} EUR
          f) Wettbewerbsverbot:                      {{KAUFPREIS_WETTBEWERBSVERBOT}} EUR
          g) Sonstiges:                              {{KAUFPREIS_SONSTIGES}} EUR

      (3) Die Kaufpreisaufteilung erfolgt in Anlehnung an die Grundsätze ordnungsgemäßer
          Buchführung und die steuerlichen Vorgaben. Die Parteien verpflichten sich, die
          vereinbarte Kaufpreisaufteilung gegenüber den Finanzbehörden einheitlich zugrunde
          zu legen.

    clauses:
      # ── 4.4 Kaufpreisanpassung (Vorräte) ──────────────────────
      - id: kaufpreis_anpassung_vorraete
        title: "Kaufpreisanpassung für Vorräte"
        required: false
        condition: "HAT_VORRAETE"
        tags: ["kaufpreis", "vorraete", "anpassung"]
        text: |
          (4) Kaufpreisanpassung Vorräte:
              Der unter Abs. (2) lit. b) genannte Betrag für Vorräte ist vorläufig.
              Der endgültige Vorrätewert wird auf Grundlage der am Stichtag
              durchzuführenden gemeinsamen körperlichen Inventur ermittelt (gemäß § 2
              Abs. (6)). Die Differenz zwischen dem vorläufigen und dem endgültigen
              Vorrätewert erhöht oder mindert den Kaufpreis.

              Die Inventur wird von beiden Parteien oder ihren Bevollmächtigten
              gemeinsam durchgeführt. Das Inventurergebnis wird in einem von beiden
              Parteien zu unterzeichnenden Protokoll festgehalten. Können sich die
              Parteien nicht auf den Wert einzelner Vorratsposten einigen, wird ein
              von der IHK {{IHK_ORT}} zu benennender Sachverständiger verbindlich
              entscheiden. Die Kosten des Sachverständigen tragen die Parteien
              je zur Hälfte.

      # ── 4.5 Kaufpreisanpassung (Forderungen) ──────────────────
      - id: kaufpreis_anpassung_forderungen
        title: "Kaufpreisanpassung für Forderungen"
        required: false
        condition: "HAT_FORDERUNGEN"
        tags: ["kaufpreis", "forderungen", "anpassung"]
        text: |
          (5) Kaufpreisanpassung Forderungen:
              Der unter Abs. (2) lit. c) genannte Betrag für Forderungen ist vorläufig.
              Soweit abgetretene Forderungen innerhalb von {{FORDERUNGEN_GARANTIEFRIST_MONATE}}
              Monaten nach dem Stichtag uneinbringlich werden und der Forderungsausfall
              nicht vom Käufer zu vertreten ist, mindert sich der Kaufpreis um den
              anteiligen Nennwert der uneinbringlichen Forderungen.

      # ── 4.6 Kaufpreisanpassung (Lizenzen) ─────────────────────
      - id: kaufpreis_anpassung_lizenzen
        title: "Kaufpreisanpassung für nicht übertragbare Lizenzen"
        required: false
        condition: "HAT_LIZENZEN"
        tags: ["kaufpreis", "lizenzen", "anpassung"]
        text: |
          (6) Kaufpreisanpassung Lizenzen:
              Soweit Software-Lizenzen gemäß § 2 Abs. (13) nicht auf den Käufer
              übertragen werden können, mindert sich der Kaufpreis um den für die
              betreffende Lizenz in Anlage 2.13 ausgewiesenen anteiligen Kaufpreis.

      # ── 4.7 Earn-Out ──────────────────────────────────────────
      - id: kaufpreis_earnout
        title: "Earn-Out-Klausel (erfolgsabhängige Kaufpreiskomponente)"
        required: false
        condition: "HAT_EARNOUT"
        tags: ["earnout", "kaufpreis", "erfolgsabhaengig"]
        risk_note: "Earn-Out-Klauseln sind streitanfällig. Eindeutige Definition der Bemessungsgrundlage und Berechnungsmethode ist essentiell."
        text: |
          (7) Earn-Out:
              Zusätzlich zum festen Kaufpreis gemäß Abs. (1) erhält der Verkäufer eine
              erfolgsabhängige Kaufpreiskomponente (nachfolgend „Earn-Out") nach Maßgabe
              der folgenden Bestimmungen:

              a) Bemessungszeitraum: Der Earn-Out wird für einen Zeitraum von
                 {{EARNOUT_LAUFZEIT_JAHRE}} Jahren ab dem Vollzugstag berechnet
                 (der „Earn-Out-Zeitraum"), unterteilt in jährliche Bemessungszeiträume
                 (jeweils ein „Earn-Out-Jahr").

              b) Bemessungsgrundlage: Der Earn-Out bemisst sich nach dem
                 {{EARNOUT_KENNZAHL}} (nachfolgend die „Bemessungsgrundlage") des
                 übernommenen Geschäftsbetriebs im jeweiligen Earn-Out-Jahr,
                 ermittelt nach den Grundsätzen ordnungsgemäßer Buchführung (HGB)
                 und unter Anwendung der zum Stichtag angewandten Bilanzierungs-
                 und Bewertungsmethoden.

              c) Earn-Out-Berechnung:
                 - Bei einer Bemessungsgrundlage bis {{EARNOUT_SCHWELLE_1}} EUR: kein Earn-Out,
                 - bei einer Bemessungsgrundlage von {{EARNOUT_SCHWELLE_1}} EUR
                   bis {{EARNOUT_SCHWELLE_2}} EUR: {{EARNOUT_PROZENT_1}} % des übersteigenden
                   Betrags,
                 - bei einer Bemessungsgrundlage über {{EARNOUT_SCHWELLE_2}} EUR:
                   {{EARNOUT_PROZENT_2}} % des übersteigenden Betrags.

              d) Obergrenze: Der Earn-Out ist auf maximal {{EARNOUT_CAP}} EUR
                 für den gesamten Earn-Out-Zeitraum begrenzt.

              e) Abrechnung und Zahlung: Der Käufer wird dem Verkäufer innerhalb von
                 {{EARNOUT_ABRECHNUNGSFRIST_MONATE}} Monaten nach Ende eines jeden
                 Earn-Out-Jahres eine Abrechnung samt Nachweis der Bemessungsgrundlage
                 vorlegen. Der Earn-Out-Betrag ist innerhalb von 30 Tagen nach
                 Zugang der Abrechnung zur Zahlung fällig.

              f) Prüfungsrecht: Der Verkäufer oder ein von ihm beauftragter
                 Wirtschaftsprüfer ist berechtigt, die der Earn-Out-Abrechnung
                 zugrunde liegenden Unterlagen einzusehen und zu prüfen.

              g) Geschäftsführungspflichten des Käufers: Der Käufer verpflichtet sich,
                 den Geschäftsbetrieb während des Earn-Out-Zeitraums ordnungsgemäß
                 und nach den Grundsätzen eines ordentlichen Kaufmanns weiterzuführen.
                 Der Käufer wird während des Earn-Out-Zeitraums keine Maßnahmen
                 ergreifen, die objektiv darauf gerichtet sind, die Bemessungsgrundlage
                 zu schmälern, insbesondere nicht:
                 - wesentliche Geschäftsbereiche stilllegen oder verlagern,
                 - Preise ohne sachlichen Grund unter Marktniveau senken,
                 - Kosten sachwidrig dem Geschäftsbetrieb zuordnen.

      # ── 4.8 Umsatzsteuer ──────────────────────────────────────
      - id: kaufpreis_umsatzsteuer
        title: "Umsatzsteuerklausel (Geschäftsveräußerung im Ganzen)"
        required: true
        condition: null
        tags: ["umsatzsteuer", "steuer", "geschaeftsveraeusserung"]
        text: |
          (8) Umsatzsteuer:
              Die Parteien gehen übereinstimmend davon aus, dass die Veräußerung
              der Kaufgegenstände eine nicht steuerbare Geschäftsveräußerung im Ganzen
              gemäß § 1 Abs. 1a UStG darstellt und folglich keine Umsatzsteuer anfällt.

              Der Verkäufer versichert, dass er ein im Ganzen übertragbares Unternehmen
              oder einen gesondert geführten Teilbetrieb veräußert. Der Käufer
              versichert, dass er den Geschäftsbetrieb als Unternehmer fortführen wird.

              Sollte die Finanzverwaltung abweichend hiervon Umsatzsteuer festsetzen,
              ist der Käufer verpflichtet, dem Verkäufer die festgesetzte Umsatzsteuer
              (derzeit {{UST_SATZ}} %) zusätzlich zum Kaufpreis zu zahlen. Im Gegenzug
              wird der Verkäufer dem Käufer eine ordnungsgemäße Rechnung mit
              gesondertem Umsatzsteuerausweis erteilen, die den Käufer zum
              Vorsteuerabzug berechtigt.

  # ═════════════════════════════════════════════════════════════════════════════
  # § 5 — KAUFPREISZAHLUNG
  # ═════════════════════════════════════════════════════════════════════════════
  - id: kaufpreiszahlung
    title: "Kaufpreiszahlung"
    required: true
    condition: null
    order: 5
    text: |
      § 5 Kaufpreiszahlung

      (1) Der Kaufpreis ist in voller Höhe am Vollzugstag (§ 7) durch Überweisung auf
          folgendes Konto des Verkäufers zur Zahlung fällig:

          Kontoinhaber:  {{VERKAEUFER_NAME}}
          IBAN:          {{VERKAEUFER_IBAN}}
          BIC:           {{VERKAEUFER_BIC}}
          Bank:          {{VERKAEUFER_BANK}}

      (2) Maßgeblich für die Rechtzeitigkeit der Zahlung ist der Eingang des Kaufpreises
          auf dem Konto des Verkäufers.

    clauses:
      # ── 5.3 Ratenzahlung ──────────────────────────────────────
      - id: zahlung_ratenzahlung
        title: "Ratenzahlung"
        required: false
        condition: "HAT_RATENZAHLUNG"
        tags: ["ratenzahlung", "finanzierung"]
        risk_note: "Ohne Sicherheiten für den Verkäufer besteht ein Ausfallrisiko. Eigentumsvorbehalt bei beweglichen Sachen empfohlen."
        text: |
          (3) Abweichend von Abs. (1) wird der Kaufpreis wie folgt in Raten gezahlt:

              a) Erste Rate in Höhe von {{RATE_1_BETRAG}} EUR ({{RATE_1_PROZENT}} %
                 des Kaufpreises) am Vollzugstag,
              b) {{RATEN_ANZAHL}} weitere gleiche Raten in Höhe von jeweils
                 {{RATE_FOLGE_BETRAG}} EUR, zahlbar jeweils zum {{RATEN_FAELLIGKEIT_TAG}}.
                 eines jeden Monats, erstmals am {{RATE_2_DATUM}},
              c) letzte Rate in Höhe von {{RATE_LETZTE_BETRAG}} EUR am {{RATE_LETZTE_DATUM}}.

          (4) Die ausstehenden Raten sind ab dem Vollzugstag mit {{RATEN_ZINSSATZ}} %
              p.a. zu verzinsen. Die Zinsen sind zusammen mit der jeweiligen Rate fällig.

          (5) Bei Verzug mit einer Rate um mehr als {{RATEN_VERZUG_TAGE}} Kalendertage
              wird der gesamte Restkaufpreis sofort zur Zahlung fällig
              (Verfallklausel).

      # ── 5.4 Treuhandkonto / Escrow ────────────────────────────
      - id: zahlung_treuhand
        title: "Treuhandkonto (Escrow)"
        required: false
        condition: "HAT_TREUHANDKONTO"
        tags: ["treuhand", "escrow", "sicherheit"]
        text: |
          (6) Ein Teilbetrag in Höhe von {{TREUHAND_BETRAG}} EUR
              ({{TREUHAND_PROZENT}} % des Kaufpreises) wird auf ein Treuhandkonto
              bei {{TREUHAENDER_NAME}} (nachfolgend der „Treuhänder") eingezahlt
              (nachfolgend das „Treuhandkonto").

              a) Der Treuhänder verwahrt den Treuhandbetrag bis zum Ablauf von
                 {{TREUHAND_LAUFZEIT_MONATE}} Monaten nach dem Vollzugstag
                 (der „Treuhandzeitraum").

              b) Der Treuhandbetrag dient der Sicherung von Ansprüchen des Käufers
                 aus Garantieverletzungen gemäß § 8 und Freistellungsansprüchen
                 gemäß § 10 dieses Vertrages.

              c) Nach Ablauf des Treuhandzeitraums wird der Treuhänder den
                 verbleibenden Treuhandbetrag abzüglich etwaiger berechtigter
                 Einbehalte an den Verkäufer auszahlen.

              d) Macht der Käufer während des Treuhandzeitraums Ansprüche geltend,
                 teilt er dies dem Treuhänder und dem Verkäufer schriftlich unter
                 Beifügung einer Begründung mit. Der Treuhänder ist berechtigt,
                 den strittigen Betrag bis zur Klärung einzubehalten.

              e) Die Kosten des Treuhandkontos tragen die Parteien je zur Hälfte.

      # ── 5.5 Kaufpreiseinbehalt ────────────────────────────────
      - id: zahlung_einbehalt
        title: "Kaufpreiseinbehalt (Retention)"
        required: false
        condition: "NOT HAT_TREUHANDKONTO"
        tags: ["einbehalt", "retention", "sicherheit"]
        text: |
          (7) Ein Teilbetrag in Höhe von {{EINBEHALT_BETRAG}} EUR
              ({{EINBEHALT_PROZENT}} % des Kaufpreises) wird vom Käufer einbehalten
              (nachfolgend der „Einbehaltsbetrag"). Der Einbehaltsbetrag dient der
              Sicherung von Ansprüchen des Käufers aus Garantieverletzungen gemäß § 8
              und wird {{EINBEHALT_MONATE}} Monate nach dem Vollzugstag an den
              Verkäufer ausgezahlt, soweit bis dahin keine berechtigten Ansprüche
              geltend gemacht wurden.

      # ── 5.6 Eigentumsvorbehalt ────────────────────────────────
      - id: zahlung_eigentumsvorbehalt
        title: "Eigentumsvorbehalt"
        required: false
        condition: "HAT_RATENZAHLUNG"
        tags: ["eigentumsvorbehalt", "sicherheit"]
        text: |
          (8) Die beweglichen Kaufgegenstände gemäß § 2 stehen bis zur vollständigen
              Zahlung des Kaufpreises unter Eigentumsvorbehalt des Verkäufers
              (§ 449 BGB). Der Käufer ist berechtigt, die unter Eigentumsvorbehalt
              stehenden Gegenstände im ordnungsgemäßen Geschäftsgang zu nutzen,
              darf sie jedoch nicht veräußern, verpfänden oder zur Sicherheit
              übereignen.

      # ── 5.7 Sicherheiten Käufer ───────────────────────────────
      - id: zahlung_sicherheiten
        title: "Weitere Sicherheiten des Käufers"
        required: false
        condition: "HAT_RATENZAHLUNG"
        tags: ["sicherheiten", "buergschaft", "grundschuld"]
        text: |
          (9) Zur Sicherung der Kaufpreisforderung stellt der Käufer dem Verkäufer
              folgende Sicherheiten:

              {{SICHERHEITEN_ART_UND_UMFANG}}

              Die Sicherheiten sind spätestens am Vollzugstag zu bestellen.
              Der Verkäufer ist verpflichtet, die Sicherheiten nach vollständiger
              Kaufpreiszahlung unverzüglich freizugeben.

  # ═════════════════════════════════════════════════════════════════════════════
  # § 6 — WIRTSCHAFTLICHER STICHTAG
  # ═════════════════════════════════════════════════════════════════════════════
  - id: stichtag
    title: "Wirtschaftlicher Stichtag"
    required: true
    condition: null
    order: 6
    text: |
      § 6 Wirtschaftlicher Stichtag; Gefahrübergang

      (1) Wirtschaftlicher Stichtag für die Übertragung der Kaufgegenstände ist der
          {{STICHTAG}} 24:00 Uhr (nachfolgend der „Stichtag").

      (2) Mit Ablauf des Stichtages gehen Nutzen und Lasten sowie die Gefahr des
          zufälligen Untergangs und der zufälligen Verschlechterung der Kaufgegenstände
          auf den Käufer über.

      (3) Sämtliche Einnahmen und Ausgaben, die wirtschaftlich den Zeitraum bis
          einschließlich des Stichtages betreffen, stehen dem Verkäufer zu bzw.
          sind von ihm zu tragen. Einnahmen und Ausgaben, die wirtschaftlich den
          Zeitraum ab dem auf den Stichtag folgenden Tag betreffen, stehen dem
          Käufer zu bzw. sind von ihm zu tragen. Die Parteien werden eine
          entsprechende Abgrenzungsrechnung erstellen.

      (4) Der Verkäufer wird den Geschäftsbetrieb in der Zeit zwischen Vertragsschluss
          und Stichtag ordnungsgemäß und im gewöhnlichen Geschäftsgang weiterführen.
          Insbesondere wird der Verkäufer ohne vorherige schriftliche Zustimmung des
          Käufers keine Maßnahmen vornehmen, die über den gewöhnlichen Geschäftsgang
          hinausgehen, insbesondere nicht:
          a) wesentliche Vermögensgegenstände veräußern oder belasten,
          b) neue Verbindlichkeiten über {{WESENTLICHKEITSSCHWELLE}} EUR einzeln
             oder {{WESENTLICHKEITSSCHWELLE_GESAMT}} EUR insgesamt eingehen,
          c) Arbeitnehmer einstellen oder kündigen (außer aus wichtigem Grund),
          d) Verträge mit einer Laufzeit von mehr als {{MAX_VERTRAGS_LAUFZEIT}} Monaten
             abschließen,
          e) Preise wesentlich ändern.

  # ═════════════════════════════════════════════════════════════════════════════
  # § 7 — VOLLZUG (CLOSING)
  # ═════════════════════════════════════════════════════════════════════════════
  - id: closing
    title: "Vollzug (Closing)"
    required: true
    condition: null
    order: 7
    text: |
      § 7 Vollzug (Closing)

      (1) Der Vollzug dieses Vertrages (nachfolgend das „Closing") findet am
          {{CLOSING_DATUM}} statt (nachfolgend der „Vollzugstag"), sofern sämtliche
          Vollzugsbedingungen gemäß § 9 erfüllt oder von der berechtigten Partei
          darauf verzichtet wurden.

      (2) Am Vollzugstag werden folgende Vollzugshandlungen Zug um Zug vorgenommen:

          Durch den Verkäufer:
          a) Übergabe des Besitzes an sämtlichen beweglichen Kaufgegenständen,
          b) Übergabe sämtlicher Schlüssel, Zugangskarten, Passwörter und Zugangsdaten,
          c) Übergabe der vollständigen Geschäftsunterlagen und Dokumentation,
          d) Übergabe unterzeichneter Abtretungserklärungen für Forderungen,
             Verträge und Schutzrechte,
          e) Mitteilung an Geschäftspartner, Kunden und Lieferanten über den
             Inhaberwechsel (nach Abstimmung mit dem Käufer),
          f) Übergabe sämtlicher in den Anlagen zu diesem Vertrag bezeichneten
             Unterlagen und Gegenstände.

          Durch den Käufer:
          g) Zahlung des am Vollzugstag fälligen Kaufpreises gemäß § 5,
          h) Übernahme der Kaufgegenstände,
          i) Übernahme der arbeitsrechtlichen Verpflichtungen gemäß § 11
             (soweit anwendbar).

      (3) Die Parteien werden über den Vollzug ein gemeinsames Closing-Protokoll
          erstellen, in dem sämtliche Vollzugshandlungen dokumentiert werden.
          Das Closing-Protokoll wird von beiden Parteien unterzeichnet.

  # ═════════════════════════════════════════════════════════════════════════════
  # § 8 — GARANTIEN DES VERKÄUFERS
  # ═════════════════════════════════════════════════════════════════════════════
  - id: garantien_verkaeufer
    title: "Garantien des Verkäufers"
    required: true
    condition: null
    order: 8
    text: |
      § 8 Garantien des Verkäufers

      Der Verkäufer gibt dem Käufer die nachfolgenden selbständigen
      Garantieversprechen im Sinne des § 311 Abs. 1 BGB (nachfolgend einzeln
      eine „Garantie" und zusammen die „Garantien") zum Stichtag ab, soweit
      nachfolgend nicht ein anderer Zeitpunkt bestimmt ist:

    clauses:
      # ── 8.1 Rechtliche Verhältnisse ───────────────────────────
      - id: garantie_rechtsverhaeltnisse
        title: "Garantien zu rechtlichen Verhältnissen"
        required: true
        condition: null
        tags: ["garantie", "recht", "eigentum"]
        text: |
          (1) Rechtliche Verhältnisse:
              a) Der Verkäufer ist uneingeschränkt berechtigt, die Kaufgegenstände
                 zu veräußern und zu übertragen. Es bestehen keine Verfügungsbeschränkungen
                 oder Veräußerungsverbote.
              b) Die Kaufgegenstände stehen im unbelasteten Eigentum des Verkäufers
                 und sind frei von Rechten Dritter, insbesondere frei von Pfandrechten,
                 Sicherungsübereignungen und sonstigen dinglichen Belastungen, sofern
                 in den Anlagen nicht anders angegeben.
              c) Der Verkäufer ist voll geschäftsfähig und befugt, diesen Vertrag
                 abzuschließen und seine Verpflichtungen hieraus zu erfüllen.
              d) Die Unterzeichnung und Durchführung dieses Vertrages verstößt nicht
                 gegen gesetzliche Vorschriften, behördliche Verfügungen, gerichtliche
                 Entscheidungen oder vertragliche Verpflichtungen des Verkäufers.

      # ── 8.2 Finanzielle Verhältnisse ──────────────────────────
      - id: garantie_finanzen
        title: "Garantien zu finanziellen Verhältnissen"
        required: true
        condition: null
        tags: ["garantie", "finanzen", "bilanz", "jahresabschluss"]
        text: |
          (2) Finanzielle Verhältnisse:
              a) Die dem Käufer vorgelegten Jahresabschlüsse und betriebswirtschaftlichen
                 Auswertungen (BWA) für die Geschäftsjahre {{BILANZ_JAHRE}} wurden
                 nach den Grundsätzen ordnungsgemäßer Buchführung aufgestellt und geben
                 ein den tatsächlichen Verhältnissen entsprechendes Bild der Vermögens-,
                 Finanz- und Ertragslage des Geschäftsbetriebs.
              b) Seit dem letzten Bilanzstichtag ({{LETZTER_BILANZSTICHTAG}}) haben sich
                 keine wesentlichen nachteiligen Veränderungen in der Vermögens-, Finanz-
                 und Ertragslage des Geschäftsbetriebs ergeben (kein „Material Adverse
                 Change").
              c) Es bestehen keine wesentlichen Verbindlichkeiten, die nicht in den
                 vorgelegten Unterlagen offengelegt wurden.
              d) Die Bücher und Aufzeichnungen des Geschäftsbetriebs sind vollständig
                 und richtig geführt.

      # ── 8.3 Steuerliche Verhältnisse ──────────────────────────
      - id: garantie_steuern
        title: "Garantien zu steuerlichen Verhältnissen"
        required: true
        condition: null
        tags: ["garantie", "steuer"]
        text: |
          (3) Steuerliche Verhältnisse:
              a) Der Verkäufer hat sämtliche Steuererklärungen für den Geschäftsbetrieb
                 fristgerecht und inhaltlich zutreffend abgegeben.
              b) Sämtliche fälligen Steuern und Abgaben wurden vollständig entrichtet.
              c) Es bestehen keine Steuerrückstände oder laufenden Betriebsprüfungen,
                 die den Geschäftsbetrieb betreffen, es sei denn, diese sind in
                 Anlage 8.3 offengelegt.
              d) Es sind dem Verkäufer keine Umstände bekannt, die zu einer Steuernachforderung
                 führen könnten.

      # ── 8.4 Sachanlagen ───────────────────────────────────────
      - id: garantie_sachanlagen
        title: "Garantien zu Sachanlagen"
        required: true
        condition: null
        tags: ["garantie", "sachanlagen", "zustand"]
        text: |
          (4) Sachanlagen:
              a) Die in Anlage 2.2 aufgeführten Sachanlagen befinden sich in einem
                 Zustand, der den ordnungsgemäßen und bestimmungsgemäßen Gebrauch
                 ermöglicht, und unterliegen einem angemessenen Wartungs- und
                 Instandhaltungsprogramm.
              b) Die Sachanlagen sind für die übliche Fortführung des Geschäftsbetriebs
                 ausreichend und betriebsbereit.
              c) Es sind keine wesentlichen Instandhaltungs- oder Erneuerungsmaßnahmen
                 erforderlich, die nicht in Anlage 8.4 offengelegt sind.

      # ── 8.4a Online-Shop / technische Funktionsfähigkeit ──────
      - id: garantie_onlineshop
        title: "Garantien zur technischen Funktionsfähigkeit des Online-Shops"
        required: false
        condition: "HAT_DOMAINS"
        tags:
          [
            "garantie",
            "onlineshop",
            "technik",
            "funktionsfaehigkeit",
            "e_commerce",
          ]
        hint: "Der Verkäufer versichert, dass der Online-Shop technisch funktionsfähig ist."
        text: |
          (4a) Online-Shop / Technische Funktionsfähigkeit:
               a) Der Online-Shop ist zum Stichtag technisch funktionsfähig und
                  betriebsbereit. Sämtliche wesentlichen Funktionen — insbesondere
                  Produktdarstellung, Warenkorb, Bestellvorgang (Checkout),
                  Zahlungsabwicklung und Versandschnittstellen — sind voll
                  funktionsfähig.
               b) Der Quellcode des Online-Shops ist frei von bekannten
                  Sicherheitslücken, Malware, Backdoors und sonstiger
                  Schadsoftware. Der Verkäufer hat angemessene Maßnahmen zum
                  Schutz vor unbefugtem Zugriff ergriffen.
               c) Die dem Online-Shop zugrunde liegende Software (Shop-System,
                  CMS, Plug-ins, Erweiterungen) befindet sich in einer aktuellen,
                  vom Hersteller unterstützten Version oder ist in
                  Anlage 8.4a mit den jeweiligen Versionsnummern dokumentiert.
               d) Die dem Online-Shop zugrunde liegenden Lizenzen (Open-Source-
                  und kommerzielle Lizenzen) sind in Anlage 2.13 vollständig
                  aufgeführt; die Nutzung verstößt nicht gegen
                  Lizenzbedingungen.
               e) Die Inhalte des Online-Shops (Produktbeschreibungen, Fotos,
                  Videos, Texte) dürfen vom Käufer rechtmäßig weiter genutzt
                  werden. Der Verkäufer verfügt über die erforderlichen
                  Nutzungsrechte oder hat diese ordnungsgemäß erworben.
               f) Der Online-Shop entspricht den wesentlichen gesetzlichen
                  Anforderungen an E-Commerce-Webseiten, insbesondere:
                  - Impressumspflicht (§ 5 TMG / § 5 DDG),
                  - Datenschutzerklärung (Art. 13 DSGVO),
                  - Widerrufsbelehrung (§ 355 BGB, Muster nach EGBGB),
                  - Preisangaben (PAngV),
                  - AGB-Einbeziehung (§§ 305 ff. BGB),
                  - Button-Lösung (§ 312j BGB),
                  - Cookie-Consent (§ 25 TTDSG).

      # ── 8.5 Immobilien ────────────────────────────────────────
      - id: garantie_immobilien
        title: "Garantien zu Grundstücken und Immobilien"
        required: false
        condition: "HAT_IMMOBILIEN"
        tags: ["garantie", "immobilien", "grundstueck"]
        text: |
          (5) Grundstücke und Immobilien:
              a) Das Grundstück steht im lastenfreien Eigentum des Verkäufers, mit
                 Ausnahme der in Anlage 8.5 aufgeführten Belastungen.
              b) Es bestehen keine öffentlich-rechtlichen Baulasten oder sonstigen
                 Beschränkungen, die einer Nutzung des Grundstücks zu dem bisherigen
                 Zweck entgegenstehen, soweit nicht offengelegt.
              c) Sämtliche auf dem Grundstück errichteten Bauwerke wurden auf Grundlage
                 rechtskräftiger Baugenehmigungen errichtet und entsprechen den
                 genehmigten Plänen.
              d) Es sind dem Verkäufer keine Altlasten oder Kontaminationen des
                 Grundstücks bekannt (vorbehaltlich § 8 Abs. (11)).

      # ── 8.6 Arbeitnehmer ──────────────────────────────────────
      - id: garantie_arbeitnehmer
        title: "Garantien zu Arbeitnehmern"
        required: false
        condition: "HAT_MITARBEITER"
        tags: ["garantie", "arbeitnehmer", "arbeitsrecht"]
        text: |
          (6) Arbeitnehmer:
              a) Die in Anlage 8.6 enthaltene Mitarbeiterliste ist vollständig und
                 zutreffend und enthält für jeden Arbeitnehmer: Name, Eintrittsdatum,
                 Funktion, Vergütung (einschließlich variabler Bestandteile),
                 Arbeitszeit, Kündigungsfrist, etwaige Sonderkündigungsschutzrechte.
              b) Es bestehen keine Abfindungsvereinbarungen, Gratifikationszusagen,
                 Tantiemen oder sonstigen Sondervergütungen, die über die in
                 Anlage 8.6 dargestellten hinausgehen.
              c) Es bestehen keine Betriebsvereinbarungen oder Tarifbindungen, die
                 nicht in Anlage 8.6 offengelegt sind.
              d) Es bestehen keine betrieblichen Altersversorgungszusagen, die über die
                 in Anlage 8.6 offengelegten hinausgehen.
              e) Es sind keine arbeitsrechtlichen Streitigkeiten anhängig oder angedroht.
              f) Sämtliche Sozialversicherungsbeiträge und Lohnsteuern wurden
                 ordnungsgemäß abgeführt.

      # ── 8.7 Verträge ──────────────────────────────────────────
      - id: garantie_vertraege
        title: "Garantien zu bestehenden Verträgen"
        required: false
        condition: "HAT_KUNDENVERTRAEGE OR HAT_LIEFERANTENVERTRAEGE"
        tags: ["garantie", "vertraege", "kunden", "lieferanten"]
        text: |
          (7) Verträge:
              a) Die in den Anlagen 2.8 und 2.9 aufgeführten Verträge sind gültig,
                 wirksam und vollziehbar. Es liegen keine Kündigungen oder
                 Kündigungsandrohungen vor.
              b) Weder der Verkäufer noch ein Vertragspartner befindet sich in Verzug
                 mit wesentlichen Verpflichtungen aus diesen Verträgen.
              c) Es bestehen keine Verträge mit dem Verkäufer nahestehenden Personen
                 (§ 138 AO), die nicht in Anlage 8.7 offengelegt sind.
              d) Die bestehenden Verträge enthalten keine Change-of-Control-Klauseln,
                 die durch die Übertragung der Kaufgegenstände ausgelöst werden,
                 es sei denn, diese sind in Anlage 8.7 offengelegt.

      # ── 8.8 Gewerbliche Schutzrechte ──────────────────────────
      - id: garantie_ip
        title: "Garantien zu gewerblichen Schutzrechten"
        required: false
        condition: "HAT_IP"
        tags: ["garantie", "ip", "patent", "marke"]
        text: |
          (8) Gewerbliche Schutzrechte:
              a) Die in Anlage 2.11 aufgeführten Schutzrechte sind gültig, bestehen
                 in vollem Umfang und stehen im unbelasteten Eigentum des Verkäufers.
              b) Es sind dem Verkäufer keine Umstände bekannt, die die Gültigkeit
                 oder den Bestand der Schutzrechte gefährden.
              c) Nach Kenntnis des Verkäufers verletzen die unter den Schutzrechten
                 betriebenen Geschäftsaktivitäten keine Rechte Dritter.
              d) Es sind keine Rechtsstreitigkeiten wegen Verletzung von Schutzrechten
                 Dritter anhängig oder angedroht.

      # ── 8.9 Compliance / Genehmigungen ────────────────────────
      - id: garantie_compliance
        title: "Garantien zu Compliance und behördlichen Genehmigungen"
        required: true
        condition: null
        tags: ["garantie", "compliance", "genehmigungen"]
        text: |
          (9) Compliance und behördliche Genehmigungen:
              a) Der Geschäftsbetrieb wird in Übereinstimmung mit allen anwendbaren
                 gesetzlichen Vorschriften und behördlichen Auflagen geführt.
              b) Sämtliche für den Betrieb erforderlichen behördlichen Genehmigungen,
                 Erlaubnisse und Konzessionen liegen vor, sind gültig und nicht
                 widerrufen oder eingeschränkt.
              c) Es bestehen keine Verstöße gegen Datenschutzvorschriften (DSGVO, BDSG)
                 und es sind keine Verfahren der Datenschutzaufsichtsbehörden anhängig
                 oder angedroht.

      # ── 8.9a Abmahnungen & Wettbewerbsrecht ───────────────────
      - id: garantie_abmahnungen
        title: "Garantien zu Abmahnungen, wettbewerbsrechtlichen Verstößen und behördlichen Verfahren"
        required: true
        condition: null
        tags:
          [
            "garantie",
            "abmahnung",
            "wettbewerbsrecht",
            "uwg",
            "behoerdliche_verfahren",
          ]
        risk_note: "Abmahnungen (insb. UWG, Markenrecht, DSGVO) können erhebliche finanzielle Risiken bergen. Ohne diese Garantie wird der Käufer blind für bestehende Risiken."
        hint: "Der Verkäufer versichert, dass keine Abmahnungen oder behördlichen Verfahren im Zusammenhang mit dem Geschäft bestehen."
        text: |
          (9a) Abmahnungen, wettbewerbsrechtliche Verstöße und behördliche Verfahren:
               a) Es bestehen keine Abmahnungen — gleich ob wettbewerbsrechtlicher,
                  markenrechtlicher, urheberrechtlicher oder datenschutzrechtlicher
                  Natur —, die den Geschäftsbetrieb oder dessen Produkte, Dienstleistungen,
                  Werbe- und Vertriebsmaßnahmen betreffen, und es sind dem Verkäufer
                  keine solchen Abmahnungen angedroht.
               b) Der Geschäftsbetrieb hat in den letzten {{ABMAHNUNG_ZEITRAUM_JAHRE}}
                  Jahren vor dem Stichtag keine Abmahnungen erhalten oder selbst
                  ausgesprochen, es sei denn, diese sind in Anlage 8.9a vollständig
                  offengelegt und abschließend erledigt.
               c) Es bestehen keine Verstöße gegen das Gesetz gegen den unlauteren
                  Wettbewerb (UWG), die Preisangabenverordnung (PAngV), das
                  Telemediengesetz (TMG/TTDSG), die EU-Verbraucherrechterichtlinie
                  oder sonstige wettbewerbsrechtliche Vorschriften.
               d) Es sind keine behördlichen Bußgeldverfahren, Ordnungswidrigkeiten-
                  verfahren oder sonstige Verwaltungsverfahren anhängig oder
                  angedroht, die den Geschäftsbetrieb betreffen, einschließlich,
                  aber nicht beschränkt auf Verfahren der:
                  - Datenschutzaufsichtsbehörden,
                  - Gewerbeaufsicht,
                  - Kartellbehörden (Bundeskartellamt),
                  - Verbraucherschutzbehörden,
                  - Finanzbehörden (außerhalb der Steuergarantien in Abs. (3)),
                  - Berufsgenossenschaften und Sozialversicherungsträger.
               e) Es bestehen keine einstweiligen Verfügungen, Unterlassungstitel
                  oder Vergleiche aus früheren Abmahnverfahren, die den
                  Geschäftsbetrieb in seiner Geschäftstätigkeit einschränken
                  oder dem Käufer Pflichten auferlegen.
               f) Sämtliche Impressums-, Kennzeichnungs- und Informationspflichten
                  (insbesondere nach TMG/TTDSG, DSGVO, PAngV, Verpackungsgesetz,
                  Elektrogesetz) werden eingehalten.

      # ── 8.9b Kartellrecht ──────────────────────────────────────
      - id: garantie_kartellrecht
        title: "Garantien zu Kartell- und Wettbewerbsrecht"
        required: false
        condition: null
        tags: ["garantie", "kartellrecht", "gwb", "wettbewerb"]
        risk_note: "Bei größeren Transaktionen kann eine Fusionskontrollanmeldung nach § 35 GWB erforderlich sein."
        text: |
          (9b) Kartell- und Wettbewerbsrecht:
               a) Der Geschäftsbetrieb hat keine Vereinbarungen getroffen oder
                  abgestimmte Verhaltensweisen praktiziert, die gegen Art. 101 AEUV
