        tags: ["garantie", "umwelt", "altlasten"]
        text: |
          (11) Umweltverhältnisse:
               a) Der Geschäftsbetrieb wird in Übereinstimmung mit allen anwendbaren
                  umweltrechtlichen Vorschriften geführt.
               b) Es bestehen keine behördlichen Anordnungen oder Auflagen im
                  Zusammenhang mit Umweltverschmutzung oder Altlasten.
               c) Nach Kenntnis des Verkäufers bestehen keine Boden- oder
                  Grundwasserkontaminationen auf dem Betriebsgrundstück.
               d) Es wurden keine Gefahrstoffe auf dem Betriebsgrundstück gelagert
                  oder verwendet, die nicht ordnungsgemäß entsorgt wurden.

      # ── 8.12 Versicherungen ───────────────────────────────────
      - id: garantie_versicherungen
        title: "Garantien zu Versicherungen"
        required: false
        condition: null
        tags: ["garantie", "versicherungen"]
        text: |
          (12) Versicherungen:
               a) Die in Anlage 8.12 aufgeführten Versicherungen bestehen und sind
