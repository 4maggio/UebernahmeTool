# ═══════════════════════════════════════════════════════════════════════════════
# MODUL-KONFIGURATION FÜR DEN VERTRAGSBAUKASTEN
# ═══════════════════════════════════════════════════════════════════════════════
module_config:
  # Diese Konfiguration definiert, wie das Frontend die Module darstellt
  wizard_steps:
    - step: 1
      title: "Vertragsparteien"
      description: "Wer sind Verkäufer und Käufer?"
      sections: ["rubrum"]
      variables: ["seller", "buyer"]
      toggles:
        - "HAT_LOI"
        - "HAT_EXKLUSIVITAET"

    - step: 2
      title: "Vertragsgegenstand"
      description: "Was wird übertragen? Legen Sie zunächst fest, ob eine Geschäftsfortführung beabsichtigt ist."
      sections: ["vertragsgegenstand"]
      variables: ["business"]
      toggles:
        - "HAT_FAHRZEUGE"
        - "HAT_IMMOBILIEN"
        - "HAT_MIETVERTRAG"
        - "HAT_VORRAETE"
        - "HAT_FORDERUNGEN"
        - "HAT_KUNDENVERTRAEGE"
        - "HAT_LIEFERANTENVERTRAEGE"
        - "HAT_IP"
        - "HAT_DOMAINS"
        - "HAT_LIZENZEN"
        - "HAT_GENEHMIGUNGEN"
        - "HAT_FIRMENFORTFUEHRUNG"

    - step: 3
      title: "Asset-Liste"
      description: "Welche konkreten Posten werden übertragen? (Anlage 2.2)"
      type: "asset_picker"
      sections: ["anlagen"]

    - step: 4
      title: "Kaufpreis & Zahlung"
      description: "Wie viel und wie wird bezahlt?"
      sections: ["kaufpreis", "kaufpreiszahlung"]
      variables: ["price"]
      toggles:
        - "HAT_EARNOUT"
        - "HAT_RATENZAHLUNG"
        - "HAT_TREUHANDKONTO"

    - step: 5
      title: "Stichtag & Vollzug"
      description: "Wann wird übergeben?"
      sections: ["stichtag", "closing", "vollzugsbedingungen"]
      variables: ["dates"]

    - step: 6
      title: "Garantien & Haftung"
      description: "Welche Zusicherungen & Schutzklauseln?"
      sections:
        ["garantien_verkaeufer", "garantie_rechtsfolgen", "freistellungen"]
      toggles:
        - "HAT_UMWELTRISIKEN"
        - "HAT_RECHTSSTREITIGKEITEN"
        - "BASKET_TIPPING"

    - step: 7
      title: "Arbeitnehmer"
      description: "Gehen Mitarbeiter über?"
      sections: ["arbeitnehmer", "abwerbeverbot"]
      condition: "HAT_MITARBEITER"

    - step: 8
      title: "Schutzklauseln"
      description: "Wettbewerbsverbot, Geheimhaltung, Übergang"
      sections: ["wettbewerbsverbot", "geheimhaltung", "uebergangsphase"]
      toggles:
        - "HAT_BERATERVERTRAG"
        - "UEBERGANG_IM_KAUFPREIS"

    - step: 9
      title: "Steuern & Recht"
      description: "Steuerliche und rechtliche Rahmenbedingungen"
      sections:
        [
          "steuerklauseln",
          "garantien_kaeufer",
          "datenschutz",
          "schlussbestimmungen",
        ]
      toggles:
        - "SCHIEDSGERICHT"

    - step: 10
      title: "Prüfen & Erstellen"
      description: "Vertrag prüfen und herunterladen"
      sections: ["unterschriften", "anlagen"]

