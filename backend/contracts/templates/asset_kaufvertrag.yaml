        text: |
          f) Der Käufer hat die verbindliche Finanzierungszusage seiner Bank
             über mindestens {{FINANZIERUNG_MINDESTBETRAG}} EUR vorgelegt.
             Die Finanzierungszusage muss folgende Mindestbedingungen erfüllen:
             {{FINANZIERUNG_BEDINGUNGEN}}.

      - id: bedingung_rechtsstreit
        title: "Keine neuen Rechtsstreitigkeiten"
        required: false
        condition: null
        tags: ["bedingung", "rechtsstreitigkeiten"]
        text: |
          g) Zwischen Vertragsschluss und Vollzugstag sind keine Rechtsstreitigkeiten
             oder behördlichen Verfahren gegen den Geschäftsbetrieb eingeleitet worden,
             deren Streitwert einzeln {{RECHTSSTREIT_SCHWELLE}} EUR oder insgesamt
             {{RECHTSSTREIT_SCHWELLE_GESAMT}} EUR übersteigt.

      - id: bedingung_ruecktritt
        title: "Rücktrittsmöglichkeit bei Nichterfüllung"
        required: true
        condition: null
        tags: ["bedingung", "ruecktritt"]
        text: |
          (2) Ist eine Vollzugsbedingung bis zum {{LONG_STOP_DATE}} (Long Stop Date)
              nicht eingetreten und wird auf sie nicht verzichtet, ist jede Partei
              berechtigt, von diesem Vertrag durch schriftliche Erklärung gegenüber
              der anderen Partei zurückzutreten. In diesem Fall entfallen sämtliche
              Rechte und Pflichten der Parteien aus diesem Vertrag; bereits erbrachte
              Leistungen sind zurückzugewähren.

          (3) Die Parteien werden sich nach Kräften darum bemühen, die
              Vollzugsbedingungen rechtzeitig herbeizuführen und einander über den
              Stand der Bemühungen unverzüglich informieren.

  # ═════════════════════════════════════════════════════════════════════════════
  # § 10 — RECHTSFOLGEN BEI GARANTIEVERLETZUNG
  # ═════════════════════════════════════════════════════════════════════════════
  - id: garantie_rechtsfolgen
    title: "Rechtsfolgen bei Garantieverletzung"
    required: true
    condition: null
    order: 10
    text: |
      § 10 Rechtsfolgen bei Garantieverletzung

      (1) Erweist sich eine Garantie des Verkäufers gemäß § 8 als unzutreffend,
          ist der Verkäufer verpflichtet, den Käufer so zu stellen, wie er stünde,
          wenn die Garantie zutreffend wäre (Naturalrestitution). Ist die
          Naturalrestitution unmöglich oder unzumutbar, hat der Verkäufer dem Käufer
          den daraus entstehenden Schaden in Geld zu ersetzen.

      (2) Die Rechte des Käufers aus einer Garantieverletzung sind ausschließlich
          in diesem § 10 geregelt. Die gesetzlichen Gewährleistungsrechte
          (§§ 434 ff. BGB) werden hierdurch abbedungen, soweit gesetzlich zulässig.
          Ansprüche aus vorsätzlicher oder arglistiger Täuschung bleiben unberührt.

    clauses:
      - id: garantie_de_minimis
        title: "De-Minimis-Schwelle"
        required: false
        condition: null
        tags: ["garantie", "haftung", "de_minimis"]
        risk_note: "Ohne De-Minimis und Basket drohen Bagatellstreitigkeiten. Empfehlung: De-Minimis 0,5-1% des Kaufpreises, Basket 2-5% des Kaufpreises."
        text: |
          (3) Der Verkäufer haftet nur für solche Garantieverletzungen, bei denen
              der Einzelschaden {{DE_MINIMIS_BETRAG}} EUR übersteigt
              (De-Minimis-Schwelle). Ansprüche unterhalb der De-Minimis-Schwelle
              bleiben bei der Berechnung der nachfolgenden Freibetragsregelung
              unberücksichtigt.

      - id: garantie_basket_tipping
        title: "Basket — Tipping Basket"
        required: false
        condition: "BASKET_TIPPING"
        tags: ["garantie", "haftung", "basket", "tipping"]
        text: |
          (4) Der Verkäufer haftet nur, wenn und soweit die Summe aller
              Einzelschäden, die die De-Minimis-Schwelle übersteigen,
              insgesamt {{BASKET_BETRAG}} EUR übersteigt (Freibetrag / Basket).
              Wird der Freibetrag überschritten, haftet der Verkäufer
              für den gesamten Betrag ab dem ersten Euro (Tipping Basket).

      - id: garantie_basket_deductible
        title: "Basket — Deductible / Selbstbehalt"
        required: false
        condition: "NOT BASKET_TIPPING"
        tags: ["garantie", "haftung", "basket", "deductible"]
        text: |
          (4) Der Verkäufer haftet nur, wenn und soweit die Summe aller
              Einzelschäden, die die De-Minimis-Schwelle übersteigen,
              insgesamt {{BASKET_BETRAG}} EUR übersteigt (Freibetrag / Basket).
              Wird der Freibetrag überschritten, haftet der Verkäufer
              nur für den den Freibetrag übersteigenden Betrag (Deductible).

      - id: garantie_haftungscap
        title: "Haftungshöchstgrenze (Cap)"
        required: true
        condition: null
        tags: ["garantie", "haftung", "cap"]
        text: |
          (5) Die Gesamthaftung des Verkäufers aus oder im Zusammenhang mit diesem
              Vertrag ist auf {{HAFTUNGSCAP_BETRAG}} EUR begrenzt
              ({{HAFTUNGSCAP_PROZENT}} % des Kaufpreises)
              (nachfolgend „Haftungshöchstgrenze" oder „Cap").

              Die Haftungsbegrenzung gilt nicht für:
              a) Ansprüche wegen Vorsatz oder Arglist,
              b) Verletzung der Eigentumsgarantie gemäß § 8 Abs. (1),
              c) Steuerfreistellungsansprüche gemäß § 11,
              d) Ansprüche aus der Verletzung wesentlicher Garantien
                 (Fundamental Warranties) gemäß Abs. (8).

      - id: garantie_verjaehrung
        title: "Verjährung der Garantieansprüche"
        required: true
        condition: null
        tags: ["garantie", "verjaehrung"]
        text: |
          (6) Ansprüche aus Garantieverletzungen verjähren wie folgt:
              a) Ansprüche aus der Verletzung von Steuergarantien (§ 8 Abs. (3)):
                 6 Monate nach Bestandskraft des die Steuer festsetzenden
                 Bescheids, spätestens jedoch {{VERJAEHRUNG_STEUER_JAHRE}} Jahre
                 nach dem Vollzugstag.
              b) Ansprüche aus der Verletzung der Eigentumsgarantie (§ 8 Abs. (1)):
                 {{VERJAEHRUNG_EIGENTUM_JAHRE}} Jahre nach dem Vollzugstag.
              c) Ansprüche aus der Verletzung von Umweltgarantien (§ 8 Abs. (11)):
                 {{VERJAEHRUNG_UMWELT_JAHRE}} Jahre nach dem Vollzugstag.
              d) Ansprüche aus der Verletzung aller übrigen Garantien:
                 {{VERJAEHRUNG_ALLGEMEIN_MONATE}} Monate nach dem Vollzugstag.

          (7) Die Verjährung wird durch schriftliche Geltendmachung des Anspruches
              gehemmt. Die Hemmung endet 6 Monate nach dem Zeitpunkt, in dem dem
              Verkäufer die Geltendmachung zugeht, sofern der Käufer nicht zuvor
              Klage erhoben oder ein Schiedsverfahren eingeleitet hat.

      - id: garantie_fundamental
        title: "Wesentliche Garantien (Fundamental Warranties)"
        required: false
        condition: null
        tags: ["garantie", "fundamental", "wesentlich"]
        text: |
          (8) Als wesentliche Garantien (Fundamental Warranties) gelten:
              a) Eigentums- und Verfügungsberechtigung (§ 8 Abs. (1)),
              b) Steuerliche Verhältnisse (§ 8 Abs. (3)),
              c) Vollständigkeit der Offenlegung (§ 8 Abs. (13)).

              Für Verletzungen wesentlicher Garantien gelten die
              Haftungshöchstgrenze und der Freibetrag gemäß Abs. (3)–(5) nicht.
              Die Haftung bei Verletzung wesentlicher Garantien ist auf
              {{FUNDAMENTAL_CAP_BETRAG}} EUR ({{FUNDAMENTAL_CAP_PROZENT}} % des
              Kaufpreises) begrenzt.

      - id: garantie_kenntnis
        title: "Kenntnisvorbehalt des Käufers"
        required: false
        condition: null
        tags: ["garantie", "kenntnis", "disclosure"]
        risk_note: "Kenntnisvorbehalte sind käuferunfreundlich. Ggf. auf 'positive Kenntnis' beschränken."
        text: |
          (9) Ansprüche des Käufers aus Garantieverletzungen bestehen nicht, soweit
              der Käufer zum Zeitpunkt des Vertragsschlusses positive Kenntnis von
              der betreffenden Unrichtigkeit der Garantie hatte.

              „Positive Kenntnis" bedeutet die tatsächliche Kenntnis des Käufers
              oder seiner in Anlage 9.9 namentlich benannten Berater; ein
              Kennenmüssen genügt nicht.

      - id: garantie_anspruchsminderung
        title: "Schadensminderung und Drittansprüche"
        required: false
        condition: null
        tags: ["garantie", "schadenminderung"]
        text: |
          (10) Der Käufer ist verpflichtet, zumutbare Maßnahmen zur Minderung eines
               Schadens aus einer Garantieverletzung zu ergreifen (§ 254 BGB). Der
               Käufer wird den Verkäufer über eine Garantieverletzung unverzüglich
               schriftlich unter Darlegung des Sachverhalts informieren.

          (11) Macht ein Dritter Ansprüche geltend, die eine Garantieverletzung
               begründen könnten, wird der Käufer den Verkäufer unverzüglich
               informieren und dem Verkäufer Gelegenheit geben, die Abwehr des
               Drittanspruchs zu übernehmen oder an der Abwehr mitzuwirken.

  # ═════════════════════════════════════════════════════════════════════════════
  # § 11 — FREISTELLUNGEN
  # ═════════════════════════════════════════════════════════════════════════════
  - id: freistellungen
    title: "Freistellungen (Indemnities)"
    required: true
    condition: null
    order: 11
    text: |
      § 11 Freistellungen

    clauses:
      - id: freistellung_steuer
        title: "Steuerliche Freistellung"
        required: true
        condition: null
        tags: ["freistellung", "steuer", "par75_ao"]
        text: |
          (1) Steuerliche Freistellung:
              Der Verkäufer stellt den Käufer von sämtlichen Steuern und
              steuerlichen Nebenleistungen frei, die den Geschäftsbetrieb
              betreffen und wirtschaftlich den Zeitraum bis einschließlich
              des Stichtages zuzurechnen sind, insbesondere von:
              a) Nachforderungen aus Betriebsprüfungen für Veranlagungszeiträume
                 bis einschließlich des Stichtages,
              b) Haftungsansprüchen nach § 75 AO (Haftung des
                 Betriebsübernehmers) für Steuern und steuerliche
                 Nebenleistungen, die vor dem Stichtag entstanden sind.

              Die Freistellung umfasst auch angemessene Kosten der
              Rechtsverteidigung (Steuerberater, Rechtsanwalt) sowie Zinsen
              und Säumniszuschläge.

      - id: freistellung_umwelt
        title: "Umweltrechtliche Freistellung"
        required: false
        condition: "HAT_UMWELTRISIKEN OR HAT_IMMOBILIEN"
        tags: ["freistellung", "umwelt", "altlasten"]
        text: |
          (2) Umweltrechtliche Freistellung:
              Der Verkäufer stellt den Käufer von sämtlichen Kosten und
              Aufwendungen frei, die sich aus einer auf den Zeitraum vor dem
              Stichtag zurückzuführenden Umweltverschmutzung,
              Bodenkontamination oder Altlast auf dem Betriebsgrundstück
              ergeben, einschließlich behördlich angeordneter Sanierungs-
              und Dekontaminationsmaßnahmen.

              Die Freistellung ist der Höhe nach auf {{UMWELT_FREISTELLUNG_CAP}} EUR
              begrenzt und kann innerhalb von {{UMWELT_FREISTELLUNG_FRIST_JAHRE}}
              Jahren nach dem Vollzugstag geltend gemacht werden.

      - id: freistellung_rechtsstreit
        title: "Freistellung für vorvertragliche Rechtsstreitigkeiten"
        required: false
        condition: "HAT_RECHTSSTREITIGKEITEN"
        tags: ["freistellung", "rechtsstreitigkeiten"]
        text: |
          (3) Freistellung für Rechtsstreitigkeiten:
              Der Verkäufer stellt den Käufer von sämtlichen Kosten, Aufwendungen,
              Schadensersatzansprüchen und sonstigen Nachteilen frei, die sich aus
              den in Anlage 8.10 aufgeführten Rechtsstreitigkeiten ergeben, soweit
              diese ihren Ursprung in Handlungen oder Unterlassungen vor dem Stichtag
              haben.

      - id: freistellung_sozialversicherung
        title: "Freistellung für Sozialversicherungsnachforderungen"
        required: false
        condition: "HAT_MITARBEITER"
        tags: ["freistellung", "sozialversicherung", "arbeitnehmer"]
        text: |
          (4) Sozialversicherungsrechtliche Freistellung:
              Der Verkäufer stellt den Käufer von Nachforderungen der
              Sozialversicherungsträger frei, soweit diese Beitragszeiträume
              vor dem Stichtag betreffen.

  # ═════════════════════════════════════════════════════════════════════════════
  # § 12 — ARBEITNEHMERÜBERGANG (§ 613a BGB)
  # ═════════════════════════════════════════════════════════════════════════════
  - id: arbeitnehmer
    title: "Übergang von Arbeitsverhältnissen (§ 613a BGB)"
    required: false
    condition: "HAT_MITARBEITER"
    order: 12
    tags: ["arbeitnehmer", "613a", "betriebsuebergang"]
    risk_note: "§ 613a BGB ist zwingend und kann nicht abbedungen werden. Informationspflicht nach § 613a Abs. 5 BGB beachten!"
    text: |
      § 12 Übergang von Arbeitsverhältnissen

      (1) Die Parteien gehen übereinstimmend davon aus, dass die Übertragung
          der Kaufgegenstände einen Betriebsübergang im Sinne des § 613a BGB
          darstellt. Die Arbeitsverhältnisse der in Anlage 12 aufgeführten
          Arbeitnehmer gehen daher kraft Gesetzes mit allen Rechten und Pflichten
          auf den Käufer über.

      (2) Der Verkäufer wird die betroffenen Arbeitnehmer unverzüglich, spätestens
          jedoch am {{ARBEITNEHMER_INFORMATION_DATUM}}, gemäß § 613a Abs. 5 BGB
          schriftlich über den Betriebsübergang informieren. Das Informationsschreiben
          wird den folgenden Inhalt haben:
          a) den geplanten Zeitpunkt des Übergangs,
          b) den Grund für den Übergang,
          c) die rechtlichen, wirtschaftlichen und sozialen Folgen des Übergangs
             für die Arbeitnehmer,
          d) die hinsichtlich der Arbeitnehmer in Aussicht genommenen Maßnahmen.

          Der Wortlaut des Informationsschreibens ist als Anlage 12.2 diesem Vertrag
          beigefügt und wurde von beiden Parteien genehmigt.

      (3) Die Arbeitnehmer haben das Recht, dem Übergang ihres Arbeitsverhältnisses
          innerhalb eines Monats nach Zugang des Informationsschreibens
          schriftlich zu widersprechen (§ 613a Abs. 6 BGB). Der Verkäufer wird
          den Käufer über jeden eingehenden Widerspruch unverzüglich informieren.

      (4) Für Arbeitnehmer, die dem Übergang widersprechen, haftet der Verkäufer
          allein für sämtliche Kosten und Ansprüche aus dem fortbestehenden
          Arbeitsverhältnis.

      (5) Der Käufer wird die Arbeitsbedingungen der übergehenden Arbeitnehmer
          für einen Zeitraum von mindestens einem Jahr nach dem Vollzugstag
          nicht zum Nachteil der Arbeitnehmer ändern, es sei denn, die Änderung
          ist aus betrieblichen Gründen zwingend erforderlich.

    clauses:
      - id: arbeitnehmer_betriebsrat
        title: "Beteiligung des Betriebsrats"
        required: false
        condition: "HAT_BETRIEBSRAT"
        tags: ["betriebsrat", "mitbestimmung"]
        text: |
          (6) Der Verkäufer wird den bestehenden Betriebsrat gemäß
              §§ 111, 112 BetrVG rechtzeitig über den geplanten Betriebsübergang
              informieren und – soweit erforderlich – einen Interessenausgleich
              und Sozialplan verhandeln.

      - id: arbeitnehmer_altersversorgung
        title: "Betriebliche Altersversorgung"
        required: false
        condition: "HAT_MITARBEITER"
        tags: ["altersversorgung", "pension", "arbeitnehmer"]
        text: |
          (7) Betriebliche Altersversorgung:
              Soweit der Verkäufer betriebliche Altersversorgungszusagen erteilt hat
              (Anlage 12.7), übernimmt der Käufer diese gemäß § 613a BGB.
              Die dem Käufer hieraus erwachsenden wirtschaftlichen Belastungen sind
              in der Kaufpreisbemessung berücksichtigt in Höhe von
              {{PENSION_RUECKSTELLUNG}} EUR (versicherungsmathematisch ermittelter
              Barwert zum Stichtag).

              Der Verkäufer haftet für einen Zeitraum von {{PENSION_NACHHAFTUNG_JAHRE}}
              Jahren nach dem Vollzugstag gesamtschuldnerisch neben dem Käufer für
              Ansprüche aus der betrieblichen Altersversorgung, die bis zum
              Vollzugstag erdient wurden (§ 613a Abs. 2 BGB).

  # ═════════════════════════════════════════════════════════════════════════════
  # § 13 — ÜBERNAHME VON VERBINDLICHKEITEN
  # ═════════════════════════════════════════════════════════════════════════════
  - id: verbindlichkeiten
    title: "Übernahme von Verbindlichkeiten"
    required: true
    condition: null
    order: 13
    text: |
      § 13 Übernahme von Verbindlichkeiten

      (1) Der Käufer übernimmt ausschließlich die in Anlage 13 aufgeführten
          Verbindlichkeiten (nachfolgend die „Übernommenen Verbindlichkeiten").

      (2) Alle nicht ausdrücklich in Anlage 13 aufgeführten Verbindlichkeiten
          verbleiben beim Verkäufer. Insbesondere übernimmt der Käufer nicht:
          a) Steuerschulden und steuerliche Nebenleistungen für Zeiträume vor
             dem Stichtag (vorbehaltlich § 75 AO),
          b) Bankverbindlichkeiten des Verkäufers,
          c) Verbindlichkeiten aus Rechtsstreitigkeiten, die ihren Ursprung
             vor dem Stichtag haben,
          d) sonstige nicht betrieblich veranlasste Verbindlichkeiten.

    clauses:
      - id: verbindlichkeiten_haftung
        title: "Fortbestehende Haftung nach § 75 AO"
        required: true
        condition: null
        tags: ["verbindlichkeiten", "haftung", "par75_ao"]
        text: |
          (3) Den Parteien ist bekannt, dass der Käufer gemäß § 75 AO für bestimmte
              Steuerschulden des Verkäufers haftet. Die Haftung des Käufers nach
              § 75 AO ist in der Steuerschutzklausel gemäß § 11 Abs. (1) berücksichtigt.
              Der Käufer ist berechtigt, bei dem zuständigen Finanzamt eine
              Unbedenklichkeitsbescheinigung nach § 22 Abs. 3 UStG zu beantragen.
              Der Verkäufer wird den Käufer hierbei unterstützen.

      - id: verbindlichkeiten_uebernahme_detail
        title: "Detaillierte Verbindlichkeitenübernahme mit Wertanpassung"
        required: false
        condition: "HAT_VERBINDLICHKEITEN"
        tags: ["verbindlichkeiten", "uebernahme"]
        text: |
          (4) Die Übernommenen Verbindlichkeiten haben zum Stichtag einen
              vorläufigen Gesamtbetrag von {{VERBINDLICHKEITEN_BETRAG}} EUR.
              Weicht der tatsächliche Betrag der Übernommenen Verbindlichkeiten
              zum Stichtag um mehr als {{VERBINDLICHKEITEN_TOLERANZ}} % vom
              vorläufigen Betrag ab, wird der Kaufpreis entsprechend angepasst.

      - id: verbindlichkeiten_par25_hgb
        title: "Ausschluss der Haftung nach § 25 HGB (Firmenfortführung)"
        required: true
        condition: null
        tags:
          ["verbindlichkeiten", "haftung", "par25_hgb", "firmenfortfuehrung"]
        risk_note: "§ 25 HGB ordnet bei Fortführung der bisherigen Firma eine Haftung des Erwerbers für Alt-Verbindlichkeiten an. Ausschluss muss unverzüglich ins Handelsregister eingetragen oder handelsüblich bekanntgemacht werden."
        hint: "Schützt den Käufer vor der Haftung für Altverbindlichkeiten bei Geschäftsfortführung."
        text: |
          (5) Haftungsausschluss nach § 25 HGB:
              a) Die Parteien stellen klar, dass eine Haftung des Käufers für
                 Verbindlichkeiten des Verkäufers gemäß § 25 HGB ausdrücklich
                 ausgeschlossen wird.
              b) Der Verkäufer stellt den Käufer von sämtlichen bestehenden
                 Verbindlichkeiten des Geschäftsbetriebs frei, die vor dem
                 Stichtag begründet wurden und nicht ausdrücklich als
                 Übernommene Verbindlichkeiten in Anlage 13 aufgeführt sind.
              c) Der Verkäufer verpflichtet sich, an der unverzüglichen
                 Bekanntmachung des Haftungsausschlusses im Sinne des
                 § 25 Abs. 2 HGB mitzuwirken, insbesondere durch:
                 - Mitwirkung an der Eintragung im Handelsregister
                   (soweit anwendbar),
                 - Zustimmung zur handelsüblichen Bekanntmachung
                   (z. B. Veröffentlichung auf der Webseite des
                   Geschäftsbetriebs, Mitteilung an Geschäftspartner),
                 - Abgabe aller hierfür erforderlichen Erklärungen.
              d) Die Kosten der Bekanntmachung tragen die Parteien
                 je zur Hälfte.

  # ═════════════════════════════════════════════════════════════════════════════
  # § 14 — WETTBEWERBSVERBOT
  # ═════════════════════════════════════════════════════════════════════════════
  - id: wettbewerbsverbot
    title: "Wettbewerbsverbot"
    required: false
    condition: null
    order: 14
    tags: ["wettbewerbsverbot", "konkurrenz"]
    risk_note: "Wettbewerbsverbote sind nur wirksam, wenn zeitlich, räumlich und sachlich angemessen begrenzt. Maximale Dauer nach herrschender Meinung: 2-3 Jahre."
    text: |
      § 14 Wettbewerbsverbot

      (1) Der Verkäufer verpflichtet sich, für die Dauer von {{WETTBEWERBSVERBOT_DAUER_JAHRE}}
          Jahren ab dem Vollzugstag weder unmittelbar noch mittelbar:
          a) ein Unternehmen zu gründen, zu erwerben oder zu betreiben, das mit dem
             Geschäftsbetrieb im Wettbewerb steht,
          b) sich an einem solchen Unternehmen gesellschaftsrechtlich zu beteiligen
             (ausgenommen reine Finanzbeteiligungen von weniger als 5 % an
             börsennotierten Unternehmen),
          c) für ein solches Unternehmen in leitender Funktion tätig zu werden
             (als Geschäftsführer, Prokurist, Berater oder in vergleichbarer
             Position),
          d) Kunden oder Lieferanten des Geschäftsbetriebs abzuwerben oder dies
             zu versuchen.

      (2) Das Wettbewerbsverbot gilt räumlich für {{WETTBEWERBSVERBOT_GEBIET}}.

      (3) Das Wettbewerbsverbot gilt sachlich für {{WETTBEWERBSVERBOT_BRANCHE}}.

      (4) Für jeden Fall der schuldhaften Zuwiderhandlung verpflichtet sich der
          Verkäufer zur Zahlung einer Vertragsstrafe in Höhe von
          {{VERTRAGSSTRAFE_BETRAG}} EUR. Im Falle eines Dauerverstoßes wird die
          Vertragsstrafe für jeden angefangenen Monat der Zuwiderhandlung fällig.
          Die Geltendmachung eines weitergehenden Schadensersatzanspruches bleibt
          unberührt.

      (5) Verstößt der Verkäufer gegen das Wettbewerbsverbot, ist der Käufer
          zusätzlich berechtigt, Unterlassung zu verlangen. Der Verkäufer
          unterwirft sich hinsichtlich des Unterlassungsanspruchs der sofortigen
          Zwangsvollstreckung gemäß § 890 ZPO.

    clauses:
      - id: wettbewerb_karenzentschaedigung
        title: "Karenzentschädigung"
        required: false
        condition: null
        tags: ["wettbewerbsverbot", "karenz", "entschaedigung"]
        risk_note: "Bei Unternehmensverkäufen ist eine Karenzentschädigung nicht gesetzlich vorgeschrieben (anders als bei § 74 HGB). Es kann aber die Wirksamkeit stärken."
        text: |
          (6) Als Gegenleistung für das Wettbewerbsverbot zahlt der Käufer dem
              Verkäufer eine Karenzentschädigung in Höhe von monatlich
              {{KARENZ_BETRAG}} EUR, zahlbar jeweils zum Monatsende. Die
              Karenzentschädigung ist im Kaufpreis (§ 4 Abs. (2) lit. f))
              gesondert ausgewiesen.

      - id: wettbewerb_non_compete_kaeufer
        title: "Fortführungspflicht / Schutz des Verkäufers (Reverse Non-Compete)"
        required: false
        condition: "HAT_EARNOUT"
        tags: ["wettbewerbsverbot", "kaeufer", "gegenseitig", "fortfuehrung"]
        risk_note: "Selten benötigt – nur relevant, wenn der Käufer bereits in einer ähnlichen Branche tätig ist und der Verkäufer Schutz vor kannibalisierender Nutzung wünscht (insb. bei Earn-Out)."
        text: |
          (7) Der Käufer verpflichtet sich, den unter der Bezeichnung
              „{{UNTERNEHMENSNAME}}" geführten Geschäftsbetrieb für die Dauer
              von {{KAEUFER_WETTBEWERB_SCHUTZ_JAHRE}} Jahren nach dem Vollzugstag
              nicht stillzulegen oder in eine andere Branche zu überführen,
              sofern nicht ein wichtiger wirtschaftlicher Grund vorliegt.
              Diese Klausel dient dem Schutz des Verkäufers hinsichtlich der
              Werthaltigkeit einer etwaigen Earn-Out-Vereinbarung (§ 4 Abs. (7))
              sowie des Interesses an der Fortführung des Geschäftsbetriebs.

      - id: wettbewerb_social_media
        title: "Non-Compete für digitale Kanäle und Social Media"
        required: false
        condition: "HAT_DOMAINS"
        tags: ["wettbewerbsverbot", "digital", "social_media"]
        text: |
          (8) Das Wettbewerbsverbot gemäß Abs. (1)–(3) umfasst auch:
              a) die Nutzung der übertragenen Domains, Social-Media-Accounts oder
                 ähnlich klingender Bezeichnungen durch den Verkäufer für
                 konkurrierende Zwecke,
              b) die Erstellung konkurrierender Online-Präsenzen unter Verwendung
                 von Kundendaten, SEO-Rankings oder sonstigen digitalen Assets
                 des Geschäftsbetriebs,
              c) bezahlte oder organische Werbung, die gezielt auf die Kunden
                 des übertragenen Geschäftsbetriebs ausgerichtet ist.

      - id: wettbewerb_schluesselkunden
        title: "Kundenschutzklausel (Key-Account Non-Compete)"
        required: false
        condition: "HAT_KUNDENVERTRAEGE"
        tags: ["wettbewerbsverbot", "kunden", "key_accounts"]
        text: |
          (9) Der Verkäufer verpflichtet sich darüber hinaus, für die Dauer des
              Wettbewerbsverbots keinen direkten geschäftlichen Kontakt zu den
              in Anlage 14.9 aufgeführten Schlüsselkunden aufzunehmen oder
              aufrechtzuerhalten, der in Konkurrenz zum übertragenen
              Geschäftsbetrieb steht. Als geschäftlicher Kontakt gilt jede
              Kontaktaufnahme, die auf die Anbahnung oder Durchführung von
              Geschäften gerichtet ist, welche dem Geschäftsgegenstand des
              übertragenen Geschäftsbetriebs entsprechen.

  # ═════════════════════════════════════════════════════════════════════════════
  # § 15 — ABWERBEVERBOT
  # ═════════════════════════════════════════════════════════════════════════════
  - id: abwerbeverbot
    title: "Abwerbeverbot (Non-Solicitation)"
    required: false
    condition: "HAT_MITARBEITER"
    order: 15
    tags: ["abwerbeverbot", "non_solicitation", "mitarbeiter"]
    text: |
      § 15 Abwerbeverbot

      (1) Der Verkäufer verpflichtet sich, für die Dauer von
          {{ABWERBEVERBOT_DAUER_JAHRE}} Jahren ab dem Vollzugstag keine
          Arbeitnehmer des Geschäftsbetriebs abzuwerben oder deren Abwerbung
          durch Dritte zu unterstützen oder zu veranlassen.

      (2) Das Abwerbeverbot gilt nicht für Arbeitnehmer, deren Arbeitsverhältnis
          vom Käufer gekündigt wurde, oder die sich auf eine öffentliche
          Stellenausschreibung des Verkäufers bewerben.

      (3) Für jeden Fall der schuldhaften Zuwiderhandlung gilt die
          Vertragsstrafenregelung gemäß § 14 Abs. (4) entsprechend.

  # ═════════════════════════════════════════════════════════════════════════════
  # § 16 — GEHEIMHALTUNG
  # ═════════════════════════════════════════════════════════════════════════════
  - id: geheimhaltung
    title: "Geheimhaltung"
    required: true
    condition: null
    order: 16
    text: |
      § 16 Geheimhaltung

      (1) Die Parteien verpflichten sich, alle im Zusammenhang mit der Vorbereitung
          und Durchführung dieses Vertrages erhaltenen Informationen über die jeweils
          andere Partei und den Geschäftsbetrieb (nachfolgend „Vertrauliche
          Informationen") streng vertraulich zu behandeln und weder gegenüber Dritten
          offenzulegen noch für andere als die in diesem Vertrag vorgesehenen Zwecke
          zu verwenden.

      (2) Die Geheimhaltungsplicht gilt nicht für Informationen, die:
          a) zum Zeitpunkt der Offenlegung bereits öffentlich bekannt waren oder
             nachträglich ohne Verschulden der empfangenden Partei öffentlich
             bekannt werden,
          b) der empfangenden Partei bereits vor der Offenlegung aus anderen
             Quellen rechtmäßig bekannt waren,
          c) von der empfangenden Partei nachweislich unabhängig entwickelt wurden,
          d) aufgrund gesetzlicher oder behördlicher Anordnung offengelegt werden
             müssen (in diesem Fall wird die offenlegende Partei die andere Partei
             hiervon unverzüglich informieren).

      (3) Die Parteien sind berechtigt, Vertrauliche Informationen an ihre
          Berater (Rechtsanwälte, Steuerberater, Wirtschaftsprüfer, Banken)
          weiterzugeben, soweit diese zur Berufsverschwiegenheit verpflichtet
          sind oder eine entsprechende Vertraulichkeitsvereinbarung unterzeichnet
          haben.

      (4) Die Geheimhaltungspflicht besteht für die Dauer von
          {{GEHEIMHALTUNG_DAUER_JAHRE}} Jahren nach dem Vollzugstag fort.

      (5) Für jeden Fall der schuldhaften Verletzung der Geheimhaltungspflicht
          zahlt die verletzende Partei eine Vertragsstrafe in Höhe von
          {{GEHEIMHALTUNG_VERTRAGSSTRAFE}} EUR. Die Geltendmachung eines
          weitergehenden Schadensersatzanspruches bleibt unberührt.

  # ═════════════════════════════════════════════════════════════════════════════
  # § 17 — ÜBERGANGSPHASE / EINARBEITUNG
  # ═════════════════════════════════════════════════════════════════════════════
  - id: uebergangsphase
    title: "Übergangsphase und Einarbeitung"
    required: false
    condition: null
    order: 17
    tags: ["uebergang", "einarbeitung", "transition"]
    text: |
      § 17 Übergangsphase und Einarbeitung

      (1) Der Verkäufer verpflichtet sich, den Käufer nach dem Vollzugstag für
          einen Zeitraum von {{EINARBEITUNG_DAUER_MONATE}} Monaten bei der
          Übernahme und Einarbeitung in den Geschäftsbetrieb zu unterstützen
          (nachfolgend die „Übergangsphase").

      (2) Während der Übergangsphase wird der Verkäufer insbesondere:
          a) den Käufer bei Kunden, Lieferanten und Geschäftspartnern einführen,
          b) Fragen zur Unternehmensführung und den betrieblichen Abläufen
             beantworten,
          c) bei der Übergabe von Wissen und Erfahrung mitwirken,
          d) bei der Migration von IT-Systemen und Daten unterstützen.

      (3) Während der Übergangsphase steht der Verkäufer dem Käufer für bis zu
          {{EINARBEITUNG_STUNDEN}} Stunden pro Woche zur Verfügung.

    clauses:
      - id: uebergang_verguetung_im_kp
        title: "Vergütung im Kaufpreis enthalten"
        required: false
        condition: "UEBERGANG_IM_KAUFPREIS"
        tags: ["uebergang", "verguetung"]
        text: |
          (4) Die Tätigkeit des Verkäufers während der Übergangsphase
              ist mit dem Kaufpreis abgegolten.

      - id: uebergang_verguetung_separat
        title: "Gesonderte Vergütung der Übergangstätigkeit"
        required: false
        condition: "NOT UEBERGANG_IM_KAUFPREIS"
        tags: ["uebergang", "verguetung"]
        text: |
          (4) Die Tätigkeit des Verkäufers während der Übergangsphase
              wird mit {{UEBERGANG_STUNDENSATZ}} EUR pro Stunde zuzüglich
              Reisekosten vergütet. Die Vergütung ist monatlich nachträglich
              fällig. Es wird kein Arbeitsverhältnis begründet.

      - id: uebergang_beratervertrag
        title: "Beratervertrag (Consulting Agreement)"
        required: false
        condition: "HAT_BERATERVERTRAG"
        tags: ["berater", "consulting", "vertrag"]
        text: |
          (5) Die Parteien werden spätestens am Vollzugstag einen gesonderten
              Beratervertrag abschließen, in dem die Tätigkeit des Verkäufers
              nach Ablauf der Übergangsphase geregelt wird (Anlage 17.5).
              Der Beratervertrag hat eine Laufzeit von
              {{BERATERVERTRAG_LAUFZEIT_MONATE}} Monaten und sieht ein
              monatliches Honorar von {{BERATERVERTRAG_HONORAR}} EUR vor.
              Die steuerliche und sozialversicherungsrechtliche Einordnung
              des Beratervertrages obliegt dem Verkäufer.

  # ═════════════════════════════════════════════════════════════════════════════
  # § 18 — STEUERKLAUSELN
  # ═════════════════════════════════════════════════════════════════════════════
  - id: steuerklauseln
    title: "Steuerliche Regelungen"
    required: true
    condition: null
    order: 18
    text: |
      § 18 Steuerliche Regelungen

    clauses:
      - id: steuer_kaufpreisaufteilung
        title: "Steuerliche Kaufpreisaufteilung"
        required: true
        condition: null
        tags: ["steuer", "kaufpreisaufteilung", "afa"]
        text: |
          (1) Die Parteien legen die in § 4 Abs. (2) vereinbarte Kaufpreisaufteilung
              auch steuerlich zugrunde. Die Parteien verpflichten sich, die
              Kaufpreisaufteilung in ihren jeweiligen Steuererklärungen
              einheitlich anzuwenden und der Finanzverwaltung gegenüber nicht
              abweichend zu erklären.

          (2) Die Kaufpreisaufteilung wurde unter Berücksichtigung der Grundsätze
              der BMF-Schreiben zur steuerlichen Behandlung von Unternehmenskäufen
              und der aktuellen Rechtsprechung des BFH erstellt.

      - id: steuer_grunderwerbsteuer
        title: "Grunderwerbsteuer"
        required: false
        condition: "HAT_IMMOBILIEN"
        tags: ["steuer", "grunderwerbsteuer", "immobilien"]
        text: |
          (3) Grunderwerbsteuer:
              Die durch die Übertragung des Grundstücks gemäß § 2 Abs. (4)
              anfallende Grunderwerbsteuer in Höhe von {{GRUNDERWERBSTEUER_SATZ}} %
              des auf das Grundstück entfallenden Kaufpreisanteils trägt
              {{GRUNDERWERBSTEUER_TRAEGER}}.

              Der Notar wird die Grunderwerbsteueranzeige gemäß § 18 GrEStG
              unverzüglich nach Beurkundung veranlassen.

      - id: steuer_par16_estg
        title: "Steuerliche Gestaltungshinweise (§ 16 EStG)"
        required: false
        condition: "seller_type == 'Privatperson' OR seller_type == 'Einzelunternehmer'"
        tags: ["steuer", "par16_estg", "veraeusserungsgewinn"]
        text: |
          (4) Den Parteien ist bekannt, dass der Verkäufer den Veräußerungsgewinn
              gemäß §§ 16, 34 EStG zu versteuern hat und unter bestimmten
              Voraussetzungen den Freibetrag nach § 16 Abs. 4 EStG sowie die
              Tarifbegünstigung nach § 34 EStG (Fünftelregelung bzw. ermäßigter
              Steuersatz bei Vollendung des 55. Lebensjahres) in Anspruch
              nehmen kann. Die steuerliche Gestaltung des Verkäufers bleibt
              allein dessen Sache; steuerliche Beratung wird den Parteien
              empfohlen.

      - id: steuer_buchwertfortfuehrung
        title: "AfA-Bemessungsgrundlage / Step-Up"
        required: false
        condition: null
        tags: ["steuer", "afa", "step_up"]
        text: |
          (5) AfA-Bemessungsgrundlage:
              Der Käufer ist berechtigt, die erworbenen Vermögensgegenstände
              mit den Anschaffungskosten (Kaufpreisanteile) zu aktivieren und
              entsprechend abzuschreiben (Step-Up). Die Nutzungsdauern
              richten sich nach den steuerlichen AfA-Tabellen.

      - id: steuer_mitwirkung
        title: "Steuerliche Mitwirkungspflichten"
        required: true
        condition: null
        tags: ["steuer", "mitwirkung"]
        text: |
          (6) Die Parteien werden einander bei der Erfüllung steuerlicher
              Pflichten, die den Geschäftsbetrieb betreffen, unterstützen und
              die hierfür erforderlichen Unterlagen und Auskünfte erteilen.
              Dies gilt insbesondere für Betriebsprüfungen, Einspruchsverfahren
              und Finanzgerichtsverfahren.

              Der Verkäufer ist verpflichtet, dem Käufer sämtliche für die
              Buchführung und Steuererklärungen des Geschäftsbetriebs
              erforderlichen Unterlagen und Informationen für Zeiträume
              vor dem Stichtag zu übergeben.

  # ═════════════════════════════════════════════════════════════════════════════
  # § 19 — GARANTIEN DES KÄUFERS
  # ═════════════════════════════════════════════════════════════════════════════
  - id: garantien_kaeufer
    title: "Garantien des Käufers"
    required: true
    condition: null
    order: 19
    text: |
      § 19 Garantien des Käufers

      Der Käufer gibt dem Verkäufer folgende Garantien:

      (1) Der Käufer ist voll geschäftsfähig und berechtigt, diesen Vertrag
          abzuschließen und seine Verpflichtungen hieraus zu erfüllen.

      (2) Die Unterzeichnung und Durchführung dieses Vertrages verstößt nicht
          gegen gesetzliche Vorschriften, behördliche Verfügungen, gerichtliche
          Entscheidungen oder vertragliche Verpflichtungen des Käufers.

      (3) Der Käufer verfügt über die zur Zahlung des Kaufpreises erforderlichen
          Mittel oder hat verbindliche Finanzierungszusagen eingeholt.

    clauses:
      - id: garantie_kaeufer_gbr
        title: "Garantien bei Käufer-GbR"
        required: false
        condition: "buyer_type == 'GbR'"
        tags: ["garantie", "kaeufer", "gbr"]
        text: |
          (4) Der Käufer versichert, dass:
              a) die GbR wirksam gegründet ist und alle Gesellschafter dem
                 Erwerb der Kaufgegenstände zugestimmt haben,
              b) der Gesellschaftsvertrag der GbR den Erwerb gestattet und die
                 hierfür erforderlichen Beschlüsse gefasst wurden,
              c) alle Gesellschafter gesamtschuldnerisch für die Verbindlichkeiten
                 aus diesem Vertrag haften (§ 721 BGB n.F.),
              d) eine etwaig erforderliche Eintragung gemäß § 707 BGB n.F. im
                 Gesellschaftsregister erfolgt ist oder unverzüglich veranlasst wird.

  # ═════════════════════════════════════════════════════════════════════════════
  # § 20 — DATENSCHUTZ (DSGVO)
  # ═════════════════════════════════════════════════════════════════════════════
  - id: datenschutz
    title: "Datenschutz"
    required: true
    condition: null
    order: 20
    text: |
      § 20 Datenschutz

      (1) Die Parteien werden die Übertragung personenbezogener Daten im Rahmen
          dieses Vertrages in Übereinstimmung mit der Datenschutz-Grundverordnung
          (DSGVO) und dem Bundesdatenschutzgesetz (BDSG) durchführen.

      (2) Soweit personenbezogene Daten von Kunden, Lieferanten oder sonstigen
          Geschäftspartnern übertragen werden, stützen sich die Parteien auf
          Art. 6 Abs. 1 lit. f) DSGVO (berechtigtes Interesse an der
          Fortführung des Geschäftsbetriebs).

    clauses:
      - id: datenschutz_arbeitnehmer
        title: "Datenschutz Arbeitnehmerdaten"
        required: false
        condition: "HAT_MITARBEITER"
        tags: ["datenschutz", "arbeitnehmer", "613a"]
        text: |
          (3) Arbeitnehmerdaten werden im Rahmen des Betriebsübergangs gemäß
              § 613a BGB auf Grundlage von Art. 6 Abs. 1 lit. b) und c) DSGVO
              übertragen.

      - id: datenschutz_information
        title: "Datenschutz Information und Vereinbarung"
        required: true
        condition: null
        tags: ["datenschutz", "information"]
        text: |
          (4) Die betroffenen Personen werden gemäß Art. 13, 14 DSGVO über die
              Übertragung ihrer Daten informiert.

          (5) Die Parteien werden — soweit erforderlich — eine gesonderte
              Vereinbarung zur gemeinsamen Verantwortlichkeit nach Art. 26 DSGVO
              oder zur Auftragsverarbeitung nach Art. 28 DSGVO abschließen.

  # ═════════════════════════════════════════════════════════════════════════════
  # § 21 — SCHLUSSBESTIMMUNGEN
  # ═════════════════════════════════════════════════════════════════════════════
  - id: schlussbestimmungen
    title: "Schlussbestimmungen"
    required: true
    condition: null
    order: 21
    text: |
      § 21 Schlussbestimmungen

      (1) Anwendbares Recht:
          Dieser Vertrag und alle sich aus oder im Zusammenhang mit diesem
          Vertrag ergebenden Streitigkeiten unterliegen ausschließlich dem
          Recht der Bundesrepublik Deutschland unter Ausschluss des
          UN-Kaufrechts (CISG) und der Verweisungsnormen des internationalen
          Privatrechts (IPR).

      (2) Schriftform:
          Änderungen und Ergänzungen dieses Vertrages einschließlich dieser
          Schriftformklausel bedürfen zu ihrer Wirksamkeit der Schriftform.
          Mündliche Nebenabreden bestehen nicht.

      (3) Salvatorische Klausel:
          Sollte eine Bestimmung dieses Vertrages ganz oder teilweise unwirksam
          oder undurchführbar sein oder werden, so wird die Gültigkeit der
          übrigen Bestimmungen hierdurch nicht berührt. Die unwirksame oder
          undurchführbare Bestimmung ist durch eine wirksame und durchführbare
          Bestimmung zu ersetzen, die dem wirtschaftlichen Zweck der unwirksamen
          oder undurchführbaren Bestimmung möglichst nahekommt. Entsprechendes
          gilt für Regelungslücken.

      (4) Kosten:
          Jede Partei trägt die ihr im Zusammenhang mit der Vorbereitung,
          Verhandlung und Durchführung dieses Vertrages entstehenden Kosten
          (Rechtsanwälte, Steuerberater, Wirtschaftsprüfer) selbst, soweit
          in diesem Vertrag nicht ausdrücklich etwas anderes bestimmt ist.

    clauses:
      - id: schluss_gerichtsstand
        title: "Gerichtsstand"
        required: false
        condition: "NOT SCHIEDSGERICHT"
        tags: ["gerichtsstand", "zustaendigkeit"]
        text: |
          (5) Gerichtsstand:
              Ausschließlicher Gerichtsstand für alle Streitigkeiten aus oder
              im Zusammenhang mit diesem Vertrag ist {{GERICHTSSTAND}}, soweit
              eine Gerichtsstandsvereinbarung zulässig ist.

      - id: schluss_schiedsgericht
        title: "Schiedsgerichtsvereinbarung"
        required: false
        condition: "SCHIEDSGERICHT"
        tags: ["schiedsgericht", "arbitration"]
        risk_note: "Schiedsverfahren sind oft schneller, aber deutlich teurer als ordentliche Gerichtsverfahren. Nur bei hohem Kaufpreis empfehlenswert."
        text: |
          (5) Schiedsgerichtsvereinbarung:
              Alle Streitigkeiten, die sich aus oder im Zusammenhang mit diesem
              Vertrag ergeben, werden nach der Schiedsgerichtsordnung der
              {{SCHIEDSINSTITUTION}} unter Ausschluss des ordentlichen Rechtsweges
              endgültig entschieden. Der Sitz des Schiedsgerichts ist
              {{SCHIEDSORT}}. Die Verhandlungssprache ist Deutsch. Das
              Schiedsgericht besteht aus {{SCHIEDSRICHTER_ANZAHL}} Schiedsrichter(n).

      - id: schluss_mediation
        title: "Mediationsklausel"
        required: false
        condition: null
        tags: ["mediation", "streitbeilegung"]
        text: |
          (6) Mediation:
              Vor Einleitung eines gerichtlichen oder schiedsgerichtlichen
              Verfahrens werden die Parteien versuchen, die Streitigkeit im
              Wege einer Mediation durch einen gemeinsam bestellten Mediator
              beizulegen. Die Mediationskosten tragen die Parteien je zur
              Hälfte. Kann die Streitigkeit nicht innerhalb von
              {{MEDIATION_FRIST_WOCHEN}} Wochen nach Beginn der Mediation
              beigelegt werden, steht den Parteien der Rechtsweg offen.

      - id: schluss_zustellungen
        title: "Zustellungen und Mitteilungen"
        required: false
        condition: null
        tags: ["zustellung", "mitteilung", "kommunikation"]
        text: |
          (7) Zustellungen und Mitteilungen:
              Sämtliche Erklärungen, Mitteilungen und Zustellungen im
              Zusammenhang mit diesem Vertrag sind in Schriftform (Brief, Telefax
              oder E-Mail mit qualifizierter elektronischer Signatur) an die
              in der Rubrum genannten Adressen zu richten. Jede Partei kann
              ihre Zustelladresse durch schriftliche Mitteilung an die andere
              Partei ändern.

      - id: schluss_gesamtvereinbarung
        title: "Gesamtvereinbarung (Entire Agreement)"
        required: false
        condition: null
        tags: ["gesamtvereinbarung", "entire_agreement"]
        text: |
          (8) Gesamtvereinbarung:
              Dieser Vertrag einschließlich seiner Anlagen enthält sämtliche
              Vereinbarungen der Parteien und ersetzt alle vorherigen
              mündlichen oder schriftlichen Absprachen, Vereinbarungen und
              Erklärungen der Parteien in Bezug auf den Vertragsgegenstand.

      - id: schluss_abtretung
        title: "Abtretungsbeschränkung"
        required: false
        condition: null
        tags: ["abtretung", "beschraenkung"]
        text: |
          (9) Abtretung:
              Die Rechte und Pflichten aus diesem Vertrag dürfen ohne vorherige
              schriftliche Zustimmung der anderen Partei nicht an Dritte
              abgetreten oder übertragen werden. Eine Abtretung an verbundene
              Unternehmen im Sinne der §§ 15 ff. AktG bedarf keiner Zustimmung,
              ist aber der anderen Partei unverzüglich mitzuteilen.

      - id: schluss_notarielle_beurkundung
        title: "Notarielle Beurkundung"
        required: false
        condition: "HAT_IMMOBILIEN"
        tags: ["notar", "beurkundung"]
        text: |
          (10) Beurkundung:
               Dieser Vertrag ist am {{BEURKUNDUNG_DATUM}} durch den Notar
               {{NOTAR_NAME}}, {{NOTAR_SITZ}}, Urkundenrollennummer {{UR_NR}},
               beurkundet worden.

