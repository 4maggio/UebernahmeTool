        required: false
        condition: "HAT_GENEHMIGUNGEN"
        tags: ["bedingung", "genehmigungen"]
        text: |
          d) Sämtliche erforderlichen behördlichen Genehmigungen und Erlaubnisse
             für die Übertragung und Fortführung des Geschäftsbetriebs durch den
             Käufer liegen vor.

      - id: bedingung_vertragspartner
