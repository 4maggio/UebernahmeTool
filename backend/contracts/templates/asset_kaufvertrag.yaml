               b) Der Geschäftsbetrieb hat seine marktbeherrschende Stellung
                  (sofern vorhanden) nicht missbraucht (Art. 102 AEUV, § 19 GWB).
               c) Es sind keine Verfahren des Bundeskartellamts oder der
                  Europäischen Kommission gegen den Geschäftsbetrieb anhängig
                  oder angedroht.
               d) Die Parteien haben geprüft, ob die Transaktion der Fusionskontrolle
                  nach §§ 35 ff. GWB oder der EU-Fusionskontrollverordnung
                  (FKVO) unterliegt. {{FUSIONSKONTROLLE_ERGEBNIS}}

